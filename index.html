<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huroof Games: Arabic alphabet games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Sans+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FF; --bg2:#DCE3FF; --card:#FFFFFF; --ink:#1B2260; --muted:#5D638F; --line:#1B2260;
  --guide:#DDE2FF; --guide-edge:#96A2F2; --sky:#E2F3FF; --board:#FFFFFF; --shade:rgba(27,34,96,.22);
  --saffron:#F6B620; --turq:#1FB5A8; --pom:#F0607A; --blue:#3B4CCA; --on:#1B2260;
  --hl:#D92D52; --ok:#12754A; --ok-bg:#DDF6E7; --no:#8A4F00; --no-bg:#FFEFC7;
  --f-ui:"Baloo Bhaijaan 2","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-ar:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;
  --r:clamp(12px,1.7vmin,22px);
  --bw:3px;
  --gap:clamp(8px,1.3vmin,18px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10143F; --bg2:#232B7A; --card:#1C2266; --ink:#F1F4FF; --muted:#A9B0E6; --line:#060828;
    --guide:#2C3590; --guide-edge:#6470E0; --sky:#16205C; --board:#16403C; --shade:rgba(0,0,0,.4);
  --hl:#FF8FA3; --ok:#7BE3AE; --ok-bg:#123B2A; --no:#FFD06B; --no-bg:#45330A;
  }
}
:root[data-theme="dark"]{
  --bg:#10143F; --bg2:#232B7A; --card:#1C2266; --ink:#F1F4FF; --muted:#A9B0E6; --line:#060828;
  --guide:#2C3590; --guide-edge:#6470E0; --sky:#16205C; --board:#16403C; --shade:rgba(0,0,0,.4);
  --hl:#FF8FA3; --ok:#7BE3AE; --ok-bg:#123B2A; --no:#FFD06B; --no-bg:#45330A;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:clamp(15px,1.9vmin,24px);line-height:1.3;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2{margin:0;font-weight:800;line-height:1.1}
h2{font-size:1.15em}
.ar{font-family:var(--f-ar);font-weight:700;direction:rtl;unicode-bidi:isolate;line-height:1.25}
.screen{height:100%;display:flex;flex-direction:column}

/* shared pieces */
.btn{font-weight:700;color:var(--on);background:var(--saffron);border:var(--bw) solid var(--line);border-radius:999px;padding:.4em 1.1em;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}
.ib{width:2.6em;height:2.6em;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--r)*.7);box-shadow:0 3px 0 var(--line);font-size:1em;padding:0;line-height:1}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.ib.sm{width:2.3em;height:2.3em}
.st{width:1em;height:1em;fill:var(--bg2);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;flex:0 0 auto}
.st.on{fill:var(--saffron)}
.top-btns{display:flex;gap:.5em;align-items:center}

/* home */
.home{overflow-y:auto;padding:var(--gap) clamp(12px,2.4vw,40px) calc(var(--gap)*1.5);gap:var(--gap)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1em}
.logo{display:flex;align-items:baseline;gap:.5em;line-height:1}
.logo-ar{font-family:var(--f-ui);font-weight:800;font-size:clamp(2.2em,7vmin,4.4em);color:var(--blue);direction:rtl}
.logo-en{font-weight:800;font-size:clamp(1.1em,2.6vmin,1.7em)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-ar{color:var(--saffron)}}
:root[data-theme="dark"] .logo-ar{color:var(--saffron)}
.home-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--gap)}
.setup{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.panel{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:clamp(10px,1.6vmin,20px)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-bottom:.6em}
.hint{color:var(--muted);font-size:.85em;margin:.6em 0 0;max-width:60ch}
.seg{display:flex;gap:.4em}
.seg button{width:2.4em;height:2.4em;border-radius:50%;background:var(--bg);border:var(--bw) solid var(--line);font-weight:800;padding:0}
.seg button.on{background:var(--blue);color:#fff}
#pcards{display:flex;flex-direction:column;gap:.6em}
.pcard{display:flex;align-items:center;gap:.7em;background:var(--bg);border:var(--bw) solid var(--line);border-left-width:14px;border-left-color:var(--pc);border-radius:calc(var(--r)*.8);padding:.5em .6em}
.pc-av{width:2.3em;height:2.3em;flex:0 0 auto;font-size:1.5em;border-radius:50%;background:var(--pc);border:var(--bw) solid var(--line);padding:0;line-height:1}
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35em}
.pc-name{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--muted);border-radius:.5em;padding:.2em .5em;-webkit-user-select:text;user-select:text}
.pc-name::placeholder{color:var(--muted);opacity:1}
.pc-lv{display:flex;gap:.3em;flex-wrap:wrap}
.pc-lv button{flex:1 1 auto;font-size:.82em;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.15em .6em;white-space:nowrap}
.pc-lv button.on{background:var(--blue);color:#fff}
.pc-col{width:2em;height:2em;flex:0 0 auto;border-radius:50%;background:var(--pc);border:var(--bw) solid var(--line);padding:0;position:relative}
.pc-col::after{content:"";position:absolute;top:50%;left:50%;width:.55em;height:.55em;margin:-.275em 0 0 -.275em;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.settings h2{margin-bottom:.45em}
.settings h2 + .chips{margin-bottom:.9em}
.settings .chips:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:.45em}
.chip{font-weight:700;background:var(--bg);border:var(--bw) solid var(--line);border-radius:999px;padding:.25em .9em;min-height:2.3em}
.chip.on{background:var(--blue);color:#fff}
.chip .ar{font-size:1.1em}
.games{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:var(--gap);min-width:0}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;text-align:left;min-height:9em;background:var(--gc);color:var(--on);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);padding:clamp(12px,2vmin,26px)}
.gcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.g-art{align-self:flex-end;margin-top:-.12em;font-size:clamp(3em,13vmin,8em);line-height:1.15;display:flex;align-items:center;gap:.08em}
.g-art .ar{color:var(--on);opacity:.9;line-height:1.15}
.g-art .em{font-size:.5em}
.g-name{margin-top:auto;font-weight:800;font-size:clamp(1.3em,3.2vmin,2em);line-height:1.05}
.g-desc{font-size:.9em;font-weight:500;max-width:22ch}
@media (max-width:820px),(orientation:portrait){
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .games{grid-auto-rows:auto}
}

/* game screen */
.gbar{display:flex;align-items:center;gap:.7em;padding:.45em clamp(8px,1.2vw,18px);background:var(--card);border-bottom:var(--bw) solid var(--line)}
.g-mid{flex:1;min-width:0;display:flex;align-items:baseline;gap:.8em;overflow:hidden;white-space:nowrap}
#g-title{font-weight:800;font-size:1.2em;overflow:hidden;text-overflow:ellipsis}
#g-prompt{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
#g-prompt .ar{color:var(--ink);font-size:1.35em;padding:0 .15em}
#g-prompt b{color:var(--ink)}
#g-round{font-weight:800;background:var(--bg2);border-radius:999px;padding:.15em .8em;white-space:nowrap}
#g-home.arm{width:auto;padding:0 .8em;background:var(--pom);color:var(--on);font-weight:700}
.tbar{height:clamp(8px,1.1vmin,14px);background:var(--bg2);border-bottom:2px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--saffron);transform-origin:left center}
#lanes{flex:1;min-height:0;display:flex;gap:var(--gap);padding:var(--gap);padding-bottom:calc(var(--gap) + 4px);touch-action:none}
.lane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line)}
.lane-head{display:flex;align-items:center;gap:.5em;padding:.25em .7em;background:var(--pc);color:var(--on);border-bottom:var(--bw) solid var(--line);font-weight:800}
.lane-head .av{font-size:1.45em;line-height:1}
.lane-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-head .sc{display:inline-flex;align-items:center;gap:.3em;background:#fff;color:var(--on);border:2px solid var(--on);border-radius:999px;padding:0 .6em;font-size:1.1em}
.lane-head .sc .st{fill:var(--saffron);stroke:var(--on)}
.lane-head .sc.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3)}}
.lane-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:35;pointer-events:none;text-align:center;font-weight:800;background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 5px 0 var(--line);padding:.5em 1em;white-space:nowrap;animation:toast .3s cubic-bezier(.3,1.5,.6,1)}
.toast .big{font-size:2.2em;line-height:1.1;display:flex;justify-content:center;gap:.1em}
@keyframes toast{from{transform:translateX(-50%) scale(.5);opacity:0}}
.fl{position:absolute;z-index:36;pointer-events:none;font-weight:800;font-size:1.6em;color:var(--ink);text-shadow:0 2px 0 var(--card),0 -2px 0 var(--card),2px 0 0 var(--card),-2px 0 0 var(--card);transform:translate(-50%,-50%);animation:fl .9s ease-out forwards;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-220%);opacity:0}}
@media (orientation:portrait){#lanes{flex-direction:column}}
@media (max-width:640px){
  #g-prompt{display:none}
  .gbar{gap:.4em}
  .gbar .top-btns{gap:.3em}
  .gbar .ib{width:2.3em;height:2.3em}
}

/* trace */
.tc-wrap{flex:1;min-height:0;position:relative}
.tc-cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tc-tip{position:absolute;left:50%;bottom:.5em;transform:translateX(-50%);background:var(--saffron);color:var(--on);font-weight:700;font-size:.9em;border:2px solid var(--line);border-radius:999px;padding:.1em .9em;white-space:nowrap;pointer-events:none}
.tools{display:flex;align-items:center;gap:.5em;padding:.45em .6em;border-top:var(--bw) solid var(--line);background:var(--bg)}
.tools .sp{flex:1}
.meter{display:flex;gap:.15em;font-size:1.9em}

/* balloons */
.pp-target{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.4em;min-height:2.6em;padding:.15em .6em;border-bottom:var(--bw) solid var(--line);background:var(--bg);font-weight:800;font-size:1.5em}
.pp-target .ar{font-size:1.5em}
.pp-sky{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sky);transition:opacity .15s}
.lane.oops .pp-sky{opacity:.45}
.bal{position:absolute;top:0;left:0;background:none;border:0;padding:0;touch-action:none;will-change:transform}
.bal::after{content:"";position:absolute;left:50%;top:86%;width:2px;height:22%;margin-left:-1px;background:var(--muted)}
.bal i{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;height:84%;border-radius:50% 50% 50% 50%/46% 46% 54% 54%;background:var(--bc);border:var(--bw) solid var(--line);box-shadow:inset -.14em -.16em 0 rgba(27,34,96,.16);color:#1B2260;font-style:normal;padding-bottom:.12em}
.bal i::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:9px;margin-left:-7px;background:var(--bc);border:var(--bw) solid var(--line);border-top:0;border-radius:0 0 7px 7px}
.bal.hit i{animation:pop .3s forwards}
.bal.miss i{animation:miss .45s forwards;background:#B9BED6}
@keyframes pop{40%{transform:scale(1.25);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes miss{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px);opacity:1}100%{opacity:0}}

/* memory */
.mm-grid{flex:1;min-height:0;display:grid;justify-content:center;align-content:center;padding:12px}
.mm-card{width:var(--cs);height:calc(var(--cs)/.78);background:none;border:0;padding:0;-webkit-perspective:700px;perspective:700px}
.mm-in{position:relative;display:block;width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .35s}
.mm-card.open .mm-in{transform:rotateY(180deg)}
.mm-back,.mm-front{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:var(--bw) solid var(--line);border-radius:calc(var(--cs)*.12);-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 4px 0 var(--line)}
.mm-back{background:var(--pc);font-size:calc(var(--cs)*.5)}
.mm-back .st{fill:#fff;stroke:var(--on)}
.mm-front{background:var(--card);color:var(--ink);transform:rotateY(180deg);gap:calc(var(--cs)*.02)}
.mm-front .big{font-size:calc(var(--cs)*.56);line-height:1.2}
.mm-front .nmc{font-size:calc(var(--cs)*.26);font-weight:800}
.mm-card.got .mm-front{background:var(--pc);color:var(--on);animation:got .4s}
@keyframes got{50%{transform:rotateY(180deg) scale(1.08)}}

/* train */
.tn-track{flex:1 1 45%;min-height:0;display:flex;align-items:flex-end;justify-content:center;position:relative;padding:0 12px 14px;background:var(--sky)}
.tn-track::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;border-top:5px solid var(--line);background:repeating-linear-gradient(90deg,var(--muted) 0 10px,transparent 10px 26px)}
.tn-train{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:calc(var(--ts)*.1);transition:transform 1.8s cubic-bezier(.55,0,.9,.5)}
.tn-train.go{transform:translateX(100vw)}
.tn-engine{font-size:calc(var(--ts)*1.05);line-height:1;transform:scaleX(-1);margin-bottom:calc(var(--ts)*.06)}
.tn-slot{width:var(--ts);height:var(--ts);flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--ts)*.24);background:var(--card);border:var(--bw) dashed var(--muted);border-radius:calc(var(--ts)*.18)}
.tn-slot::before,.tn-slot::after{content:"";position:absolute;bottom:calc(var(--ts)*-.27);width:calc(var(--ts)*.24);height:calc(var(--ts)*.24);border-radius:50%;background:var(--line);border:2px solid var(--muted)}
.tn-slot::before{left:10%}
.tn-slot::after{right:10%}
.tn-slot.full{border-style:solid;border-color:var(--line)}
.tn-slot .ghost{font-size:calc(var(--ts)*.5);color:var(--muted);opacity:.45}
.tn-slot.full .ghost{display:none}
.tn-tray{flex:1 1 55%;min-height:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:calc(var(--ts)*.22);padding:12px}
.tn-tile{width:calc(var(--ts)*.94);height:calc(var(--ts)*.94);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(var(--ts)*.18);box-shadow:0 4px 0 var(--line);font-size:calc(var(--ts)*.5);touch-action:none;cursor:grab;position:relative;transition:transform .2s;padding-bottom:.1em}
.tn-tile.drag{transition:none;z-index:40;box-shadow:0 12px 0 var(--shade);cursor:grabbing}
.tn-tile.no{animation:no .35s}
@keyframes no{25%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
.tn-tile.placed{position:absolute;top:0;left:0;width:100%;height:100%;border:0;box-shadow:none;background:var(--pc);color:var(--on);border-radius:inherit;pointer-events:none;animation:got2 .3s}
@keyframes got2{50%{transform:scale(1.15)}}

/* podium */
#podium{align-items:center;justify-content:center;gap:calc(var(--gap)*1.5);padding:var(--gap);text-align:center;overflow-y:auto}
#p-title{font-size:clamp(1.8em,6vmin,3.6em)}
#p-stand{display:flex;align-items:flex-end;justify-content:center;gap:var(--gap);width:min(92%,46em)}
.pod{flex:1;max-width:14em;display:flex;flex-direction:column;align-items:center;min-width:0}
.pod-av{font-size:clamp(2.4em,9vmin,5em);line-height:1.1}
.pod-crown{font-size:clamp(1.4em,5vmin,2.8em);line-height:1;margin-bottom:-.15em}
.pod-nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:.3em}
.pod-blk{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.1em;padding:.5em .3em;background:var(--pc);color:var(--on);border:var(--bw) solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;font-weight:800}
.pod-sc{display:flex;align-items:center;gap:.25em;font-size:1.7em}
.pod-sc .st{fill:#fff;stroke:var(--on)}
.pod-rk{font-size:1em}
.pod.r1 .pod-blk{height:clamp(8em,30vmin,15em)}
.pod.r2 .pod-blk{height:clamp(6em,22vmin,11em)}
.pod.r3 .pod-blk{height:clamp(4.6em,15vmin,8em)}
.p-btns{display:flex;gap:1em;flex-wrap:wrap;justify-content:center;font-size:1.2em}
#confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:80}
#confetti i{position:absolute;top:-4vh;width:1.4vmin;height:2.4vmin;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* whiteboard */
#board{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:rgba(120,130,200,.12)}
#board.solid{background:var(--board)}
#bd-cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bd-guide{position:absolute;top:0;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:var(--guide-edge)}
#bd-guide .ar{font-size:min(52vh,60vw);line-height:1.3;opacity:.55}
#bd-guide b{font-size:1.6em;color:var(--muted)}
#bd-tools{position:absolute;left:50%;bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4em .5em;max-width:calc(100% - 16px);width:max-content;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:.45em .6em}
#bd-tools .grp{display:flex;align-items:center;gap:.35em}
#bd-tools .sep{width:2px;align-self:stretch;background:var(--bg2)}
.pen{width:2.1em;height:2.1em;border-radius:50%;border:var(--bw) solid var(--line);padding:0;background:var(--pcol)}
.pen.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--blue)}
.sz{width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--muted);background:var(--bg);padding:0;display:inline-flex;align-items:center;justify-content:center}
.sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.sz.on{border-color:var(--blue);border-width:4px}
#bd-tools .ib{font-size:.9em}
#bd-tools .ib.on{background:var(--blue);color:#fff}
#bd-letter{font-size:1.2em;width:2.2em;height:2.2em;padding-bottom:.15em}

.old-sec{flex:0 0 auto}

.old-sec .home-grid{margin-top:var(--gap)}

.dy-rank{display:flex;flex-direction:column;gap:.6em;list-style:none;margin:0;padding:0}

.dy-rank .av{font-size:1.4em}

@media (max-width:640px){

const COLORS = ['#F6B620','#35C9BC','#FF8094','#A99BFF','#6FD08C','#FF9F4A'];
const AVATARS = ['🦊','🐼','🦁','🐸','🐙','🦄','🐯','🐨','🐵','🐰'];
const BAL_COLORS = ['#FFC93C','#5ED6C9','#FF8FA0','#BDB0FF','#8EDC9F','#FFB26B','#8CC8FF'];

/* ---------- settings ---------- */
const LS_KEY = 'huroof.settings.v1';
const S = {
  count: Math.min(window.innerWidth, window.innerHeight) < 600 ? 1 : 3,
  players: [0,1,2].map(i => ({name:'', color:COLORS[i], avatar:AVATARS[i], level:1})),
  set:'g1', length:'normal', muted:false
};
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d || typeof d !== 'object') return;
    if ([1,2,3].indexOf(d.count) >= 0) S.count = d.count;
    if (SETS.some(s => s.id === d.set)) S.set = d.set;
    if (LENS.some(s => s.id === d.length)) S.length = d.length;
    S.muted = !!d.muted;
    if (Array.isArray(d.players)) d.players.slice(0,3).forEach((p,i) => {
      if (!p || typeof p !== 'object') return;
      const q = S.players[i];
      if (typeof p.name === 'string') q.name = p.name.slice(0,10);
      if (COLORS.indexOf(p.color) >= 0) q.color = p.color;
      if (AVATARS.indexOf(p.avatar) >= 0) q.avatar = p.avatar;
      if ([0,1,2].indexOf(p.level) >= 0) q.level = p.level;
    });
  } catch (e) {}
}
const pname = (p, i) => (p.name && p.name.trim()) || ('Player ' + (i + 1));

/* ---------- sound ---------- */
let actx = null;
function audio(){
  if (S.muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  return actx;
}
function tone(freq, dur, type, vol, when, slide){
  const a = audio(); if (!a) return;
  try {
    const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
const sfx = {
  pop:  () => tone(560, 0.13, 'triangle', 0.22, 0, 130),
  good: () => { tone(660, 0.12, 'sine', 0.18); tone(990, 0.2, 'sine', 0.18, 0.1); },
  bad:  () => tone(190, 0.22, 'sawtooth', 0.07, 0, 120),
  flip: () => tone(430, 0.06, 'triangle', 0.1),
  choo: () => { tone(520, 0.22, 'square', 0.05); tone(520, 0.4, 'square', 0.05, 0.28); },
  win:  () => [523,659,784,1047].forEach((f,i) => tone(f, 0.28, 'triangle', 0.18, i * 0.14))
};
let arVoice = null, canSpeak = false;
function loadVoices(){
  try { const vs = window.speechSynthesis.getVoices(); arVoice = vs.filter(v => /^ar/i.test(v.lang))[0] || null; canSpeak = !!arVoice; } catch (e) { canSpeak = false; }
}
if ('speechSynthesis' in window) { loadVoices(); try { window.speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function say(L){
  if (S.muted || !canSpeak || !L) return;
  try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(L.ar); u.lang = arVoice.lang; u.voice = arVoice; u.rate = 0.75; window.speechSynthesis.speak(u); } catch (e) {}
}
function setMuted(m){
  S.muted = m; save();
  $$('.mute-btn').forEach(b => { b.textContent = m ? '🔇' : '🔊'; b.setAttribute('aria-pressed', String(m)); });
  if (m && 'speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

/* ---------- fonts ---------- */
const ARF = '"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,"DejaVu Sans",sans-serif';
let fontsP = null;
function fontsReady(){
  if (!fontsP) fontsP = new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    setTimeout(fin, 1800);
    try { document.fonts.load('700 64px "Noto Sans Arabic"', 'ب').then(fin, fin); } catch (e) { fin(); }
  });
  return fontsP;
}

/* ---------- game clock (pauses with the whiteboard) ---------- */
const clock = { gen:0, timers:[], paused:false, update:null };
function after(ms, fn){ clock.timers.push({t:ms, fn:fn}); }
function startClock(update){
  const gen = ++clock.gen; clock.timers = []; clock.update = update; clock.paused = false;
  let last = performance.now();
  const loop = ts => {
    if (gen !== clock.gen) return;
    const dt = clamp(ts - last, 0, 64); last = ts;
    if (!clock.paused) {
      const list = clock.timers.slice();
      for (let i = 0; i < list.length; i++) {
        if (gen !== clock.gen) return;
        const tm = list[i], idx = clock.timers.indexOf(tm);
        if (idx < 0) continue;
        tm.t -= dt;
        if (tm.t <= 0) { clock.timers.splice(idx, 1); tm.fn(); }
      }
      if (gen !== clock.gen) return;
      if (clock.update) clock.update(dt);
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function stopClock(){ clock.gen++; clock.timers = []; clock.update = null; }

/* ---------- screens ---------- */
function show(id){ ['home','game','podium','neu'].forEach(s => { $('#' + s).hidden = s !== id; }); }

function renderHome(){
  $('#count').innerHTML = [1,2,3].map(n => '<button type="button" data-n="' + n + '" class="' + (S.count === n ? 'on' : '') + '" aria-pressed="' + (S.count === n) + '">' + n + '</button>').join('');
  const wrap = $('#pcards'); wrap.innerHTML = '';
  S.players.forEach((p, i) => {
    if (i >= S.count) return;
    const c = el('div', 'pcard'); c.style.setProperty('--pc', p.color);
    c.innerHTML =
      '<button type="button" class="pc-av" data-act="av" data-i="' + i + '" aria-label="Change picture">' + p.avatar + '</button>' +
      '<div class="pc-main"><input class="pc-name" data-i="' + i + '" maxlength="10" placeholder="Player ' + (i + 1) + '" aria-label="Player ' + (i + 1) + ' name" autocomplete="off">' +
      '<div class="pc-lv" role="group" aria-label="Level">' +
      LEVELS.map((l, k) => '<button type="button" data-act="lv" data-i="' + i + '" data-v="' + k + '" class="' + (p.level === k ? 'on' : '') + '" aria-pressed="' + (p.level === k) + '">' + l.icon + ' ' + l.label + '</button>').join('') +
      '</div></div>' +
      '<button type="button" class="pc-col" data-act="col" data-i="' + i + '" aria-label="Change colour"></button>';
    $('.pc-name', c).value = p.name;
    wrap.appendChild(c);
  });
  $('#sets').innerHTML = SETS.map(s => '<button type="button" class="chip ' + (S.set === s.id ? 'on' : '') + '" data-set="' + s.id + '" aria-pressed="' + (S.set === s.id) + '">' + (s.ar ? '<span class="ar" lang="ar">' + s.label + '</span>' : s.label) + '</button>').join('');
  $('#lens').innerHTML = LENS.map(s => '<button type="button" class="chip ' + (S.length === s.id ? 'on' : '') + '" data-len="' + s.id + '" aria-pressed="' + (S.length === s.id) + '">' + s.label + '</button>').join('');
}
function nextFree(list, cur, key){
  const used = S.players.slice(0, S.count).map(p => p[key]);
  let k = list.indexOf(cur);
  for (let n = 0; n < list.length; n++) { k = (k + 1) % list.length; if (used.indexOf(list[k]) < 0) return list[k]; }
  return cur;
}
$('#home').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-n')) { S.count = +t.getAttribute('data-n'); }
  else if (t.hasAttribute('data-set')) { S.set = t.getAttribute('data-set'); }
  else if (t.hasAttribute('data-len')) { S.length = t.getAttribute('data-len'); }
  else if (t.hasAttribute('data-act')) {
    const p = S.players[+t.getAttribute('data-i')], a = t.getAttribute('data-act');
    if (a === 'av') p.avatar = nextFree(AVATARS, p.avatar, 'avatar');
    else if (a === 'col') p.color = nextFree(COLORS, p.color, 'color');
    else if (a === 'lv') p.level = +t.getAttribute('data-v');
  }
  else if (t.hasAttribute('data-game')) { startGame(t.getAttribute('data-game')); return; }
  else return;
  save(); renderHome();
});
$('#home').addEventListener('input', e => {
  if (e.target.classList.contains('pc-name')) { S.players[+e.target.getAttribute('data-i')].name = e.target.value.slice(0, 10); save(); }
});

/* ---------- game session ---------- */
let G = null, starting = false;
const GAMES = {};

function startGame(id){
  if (starting) return; starting = true; audio();
  fontsReady().then(() => { starting = false; begin(id); });
}
function begin(id){
  const def = GAMES[id], set = SETS.filter(s => s.id === S.set)[0];
  G = { id:id, def:def, round:0, rounds:def.rounds[S.length], pool:LETTERS.slice(set.a, set.b), deck:[], L:null, lanes:[], time:0, timeMax:0, roundOver:false, firstDone:false };
  show('game');
  $('#g-title').textContent = def.title;
  $('#g-say').hidden = !(def.speaks && canSpeak);
  const wrap = $('#lanes'); wrap.innerHTML = '';
  G.lanes = S.players.slice(0, S.count).map((p, i) => {
    const lane = el('div', 'lane'); lane.style.setProperty('--pc', p.color);
    lane.innerHTML = '<div class="lane-head"><span class="av">' + p.avatar + '</span><span class="nm"></span><span aria-hidden="true">' + LEVELS[p.level].icon + '</span><span class="sc">' + STAR + '<b>0</b></span></div><div class="lane-body"></div>';
    $('.nm', lane).textContent = pname(p, i);
    wrap.appendChild(lane);
    return { i:i, p:p, el:lane, body:$('.lane-body', lane), scWrap:$('.sc', lane), scEl:$('.sc b', lane), score:0, done:false, toastEl:null };
  });
  startClock(tick);
  nextRound();
}
function tick(dt){
  if (!G) return;
  if (G.timeMax > 0 && !G.roundOver) {
    G.time -= dt;
    $('#g-time').style.transform = 'scaleX(' + clamp(G.time / G.timeMax, 0, 1).toFixed(4) + ')';
    if (G.time <= 0) G.def.timeUp();
  }
  if (G && G.def.update) G.def.update(dt);
}
function nextRound(){
  if (!G) return;
  if (G.round >= G.rounds) { finish(); return; }
  G.round++; G.roundOver = false; G.firstDone = false;
  $('#g-round').textContent = G.round + ' / ' + G.rounds;
  $('#g-time').style.transform = 'scaleX(1)';
  G.lanes.forEach(l => { l.done = false; hideToast(l); });
  G.def.round();
}
function endRound(ms){ if (G.roundOver) return; G.roundOver = true; after(ms, nextRound); }
function allDone(){ if (G.lanes.every(l => l.done)) endRound(1700); }
function draw(){
  if (!G.deck.length) G.deck = shuffle(G.pool.filter(L => L !== G.L));
  return G.deck.pop();
}
function setPrompt(html){ $('#g-prompt').innerHTML = html; }
function addScore(lane, pts){
  lane.score += pts; lane.scEl.textContent = lane.score;
  lane.scWrap.classList.remove('bump'); void lane.scWrap.offsetWidth; lane.scWrap.classList.add('bump');
}
function toast(lane, html){ hideToast(lane); const t = el('div', 'toast', html); lane.el.appendChild(t); lane.toastEl = t; }
function hideToast(lane){ if (lane.toastEl) { lane.toastEl.remove(); lane.toastEl = null; } }
function floatAt(lane, node, text){
  const a = lane.el.getBoundingClientRect(), r = node.getBoundingClientRect();
  const f = el('div', 'fl'); f.textContent = text;
  f.style.left = (r.left + r.width / 2 - a.left) + 'px'; f.style.top = (r.top + r.height / 2 - a.top) + 'px';
  lane.el.appendChild(f); setTimeout(() => f.remove(), 950);
}
function firstBonus(){ if (!G.firstDone && G.lanes.length > 1) { G.firstDone = true; return true; } return false; }
function quitGame(){ stopClock(); G = null; try { window.speechSynthesis.cancel(); } catch (e) {} show('home'); }

/* ---------- game 1: trace it ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const TRACE_STARS = [[0.3,0.55,0.75],[0.4,0.65,0.86],[0.4,0.65,0.84]];
const TRACE_TOL = [2.6,1.8,1.8];   // how far outside the letter a line may wander, in stroke widths

function letterGeom(ch, w, h){
  mctx.font = '700 200px ' + ARF; mctx.textAlign = 'left'; mctx.textBaseline = 'alphabetic';
  const m = mctx.measureText(ch);
  const l = m.actualBoundingBoxLeft || 0, r = m.actualBoundingBoxRight || m.width;
  const as = m.actualBoundingBoxAscent || 150, ds = m.actualBoundingBoxDescent || 0;
  const gw = Math.max(20, l + r), gh = Math.max(20, as + ds);
  const s = Math.min(w * 0.6 / gw, h * 0.62 / gh, Math.min(w, h) * 1.15 / 200);
  return { fs:200 * s, x:w / 2 - ((r - l) / 2) * s, y:h / 2 + ((as - ds) / 2) * s };
}
function strokePath(c, pts, k){
  c.beginPath(); c.moveTo(pts[0].x * k, pts[0].y * k);
  if (pts.length === 1) c.lineTo(pts[0].x * k + 0.01, pts[0].y * k);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x * k, pts[i].y * k);
  c.stroke();
}
function traceSize(lane){
  const t = lane.t, r = t.cv.getBoundingClientRect();
  t.w = Math.max(60, r.width); t.h = Math.max(60, r.height); t.dpr = Math.min(2, window.devicePixelRatio || 1);
  t.cv.width = Math.round(t.w * t.dpr); t.cv.height = Math.round(t.h * t.dpr);
  t.g = letterGeom(G.L.ch, t.w, t.h);
  // low-resolution masks used to score the tracing
  const mw = 120, k = mw / t.w, mh = Math.max(8, Math.round(t.h * k)), n = mw * mh;
  const c = document.createElement('canvas'); c.width = mw; c.height = mh;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.font = '700 ' + (t.g.fs * k) + 'px ' + ARF; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.fillStyle = '#000'; x.strokeStyle = '#000'; x.lineJoin = 'round';
  x.fillText(G.L.ch, t.g.x * k, t.g.y * k);
  let d = x.getImageData(0, 0, mw, mh).data;
  const Lm = new Uint8Array(n); let nL = 0;
  for (let i = 0; i < n; i++) if (d[i * 4 + 3] > 90) { Lm[i] = 1; nL++; }
  // stroke thickness of this font, estimated as 2 x area / outline length
  let edge = 0;
  for (let i = 0; i < n; i++) {
    if (!Lm[i]) continue;
    const ex = i % mw;
    if (ex === 0 || !Lm[i - 1]) edge++;
    if (ex === mw - 1 || !Lm[i + 1]) edge++;
    if (i < mw || !Lm[i - mw]) edge++;
    if (i >= n - mw || !Lm[i + mw]) edge++;
  }
  t.thick = clamp((2 * nL / Math.max(1, edge * 0.785)) / k, t.g.fs * 0.06, t.g.fs * 0.3);
  t.brush = clamp(t.thick, 8, 70);
  x.lineWidth = t.thick * k * TRACE_TOL[lane.p.level]; x.strokeText(G.L.ch, t.g.x * k, t.g.y * k);
  d = x.getImageData(0, 0, mw, mh).data;
  const Dm = new Uint8Array(n);
  for (let i = 0; i < n; i++) if (d[i * 4 + 3] > 40) Dm[i] = 1;
  // separate parts of the letter (body and dots) so dots are not skipped
  const lab = new Int16Array(n), sizes = [0];
  for (let i = 0; i < n; i++) {
    if (!Lm[i] || lab[i]) continue;
    const id = sizes.length; let sz = 0; const st = [i]; lab[i] = id;
    while (st.length) {
      const q = st.pop(); sz++;
      const qx = q % mw, qy = (q - qx) / mw;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = qx + dx, ny = qy + dy;
        if (nx < 0 || ny < 0 || nx >= mw || ny >= mh) continue;
        const j = ny * mw + nx;
        if (Lm[j] && !lab[j]) { lab[j] = id; st.push(j); }
      }
    }
    sizes.push(sz);
  }
  x.clearRect(0, 0, mw, mh);
  t.mask = { mw:mw, mh:mh, k:k, n:n, x:x, Lm:Lm, Dm:Dm, nL:nL, lab:lab, sizes:sizes };
  traceDraw(lane);
}
function traceDraw(lane){
  const t = lane.t, c = t.ctx;
  c.setTransform(t.dpr, 0, 0, t.dpr, 0, 0); c.clearRect(0, 0, t.w, t.h);
  if (t.alpha > 0.01) {
    c.save(); c.globalAlpha = t.alpha;
    c.font = '700 ' + t.g.fs + 'px ' + ARF; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = cssVar('--guide'); c.fillText(G.L.ch, t.g.x, t.g.y);
    c.setLineDash([t.g.fs * 0.035, t.g.fs * 0.03]); c.lineWidth = Math.max(2, t.g.fs * 0.012); c.strokeStyle = cssVar('--guide-edge');
    c.strokeText(G.L.ch, t.g.x, t.g.y);
    c.restore();
  }
  c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = lane.p.color; c.lineWidth = t.brush;
  t.strokes.forEach(s => strokePath(c, s, 1));
}
function traceEval(lane){
  const t = lane.t, m = t.mask, x = m.x;
  x.clearRect(0, 0, m.mw, m.mh);
  if (!t.strokes.length) return { q:0, parts:false };
  x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = Math.max(2, t.thick * 1.7 * m.k);
  t.strokes.forEach(s => strokePath(x, s, m.k));
  const d = x.getImageData(0, 0, m.mw, m.mh).data, cov = new Int32Array(m.sizes.length);
  let nS = 0, inter = 0, out = 0;
  for (let i = 0; i < m.n; i++) {
    if (d[i * 4 + 3] > 60) { nS++; if (m.Lm[i]) { inter++; cov[m.lab[i]]++; } if (!m.Dm[i]) out++; }
  }
  let parts = true;
  for (let c = 1; c < m.sizes.length; c++) if (m.sizes[c] >= 4 && cov[c] / m.sizes[c] < 0.35) parts = false;
  const q = clamp((m.nL ? inter / m.nL : 0) - (nS ? out / nS : 0) * 0.7, 0, 1);
  return { q:q, parts:parts };
}
function traceStars(lane){
  const r = traceEval(lane), th = TRACE_STARS[lane.p.level];
  let s = r.q >= th[2] ? 3 : r.q >= th[1] ? 2 : r.q >= th[0] ? 1 : 0;
  const dots = s === 3 && !r.parts;
  if (dots) s = 2;
  return { s:s, dots:dots };
}
function traceMeter(lane){
  const t = lane.t, r = traceStars(lane);
  t.meter.forEach((sv, i) => sv.classList.toggle('on', i < r.s));
  t.tip.hidden = !r.dots;
  if (r.s === 3 && !lane.done) traceFinish(lane);
}
function traceFinish(lane){
  if (lane.done) return; lane.done = true;
  const t = lane.t, r = traceStars(lane); t.active.clear();
  t.meter.forEach((sv, i) => sv.classList.toggle('on', i < r.s));
  t.tip.hidden = true; t.alpha = 1; t.fade = -1; traceDraw(lane);
  let pts = r.s * 10, msg = r.s ? '+' + pts : 'Good try!';
  if (r.s >= 2 && firstBonus()) { pts += 5; msg = 'First! +' + pts; }
  if (pts) addScore(lane, pts);
  if (r.s) sfx.good(); else sfx.bad();
  toast(lane, '<div class="big">' + stars(r.s) + '</div><div>' + msg + '</div>');
  allDone();
}
function traceSetup(lane){
  const lvl = lane.p.level;
  lane.body.innerHTML =
    '<div class="tc-wrap"><canvas class="tc-cv"></canvas><div class="tc-tip" hidden>Don\'t forget the dots</div></div>' +
    '<div class="tools"><div class="meter" aria-label="Stars earned">' + stars(0) + '</div><span class="sp"></span>' +
    '<button type="button" class="ib sm" data-a="undo" aria-label="Undo">↩️</button>' +
    '<button type="button" class="ib sm" data-a="clear" aria-label="Clear">🗑️</button>' +
    '<button type="button" class="btn" data-a="done">Done</button></div>';
  const cv = $('.tc-cv', lane.body);
  const t = lane.t = { cv:cv, ctx:cv.getContext('2d'), strokes:[], active:new Map(), alpha:1, fade:lvl === 2 ? 3500 : -1, tip:$('.tc-tip', lane.body), meter:$$('.meter .st', lane.body) };
  traceSize(lane);
  const pt = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => {
    if (lane.done || clock.paused || G.roundOver) return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const s = [pt(e)]; t.strokes.push(s); t.active.set(e.pointerId, s);
    const c = t.ctx; c.strokeStyle = lane.p.color; c.lineWidth = t.brush; c.lineCap = 'round'; strokePath(c, s, 1);
  });
  cv.addEventListener('pointermove', e => {
    const s = t.active.get(e.pointerId); if (!s) return;
    const c = t.ctx; c.strokeStyle = lane.p.color; c.lineWidth = t.brush; c.lineCap = 'round'; c.lineJoin = 'round';
    coalesced(e).forEach(ev => { const p = pt(ev), a = s[s.length - 1]; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(p.x, p.y); c.stroke(); s.push(p); });

/* ---------- game 2: balloon pop ---------- */
const POP_GAP = [1150, 950, 780], POP_RISE = [6500, 5200, 4200];
function distractor(lvl){
  const T = G.L, grp = lookGroup(T);
  if (lvl === 2 && grp && Math.random() < 0.7) {
    const cs = grp.split('').filter(c => c !== T.ch), c = pick(cs);
    return LETTERS.filter(L => L.ch === c)[0];
  }
  let src = lvl === 2 ? LETTERS : G.pool;
  if (lvl === 0) { const far = src.filter(L => L !== T && (!grp || grp.indexOf(L.ch) < 0)); if (far.length) src = far; }
  let L; do { L = pick(src); } while (L === T);
  return L;
}
function spawnBalloon(lane){
  const b = lane.b, lvl = lane.p.level;
  const size = clamp(Math.min(b.w / 3.2, b.h / 3.4), 56, 170), h = size * 1.2;
  const cols = Math.max(1, Math.floor(b.w / (size * 1.08)));
  let col; do { col = Math.floor(Math.random() * cols); } while (cols > 1 && col === b.col); b.col = col;
  const cw = b.w / cols, x = cw * col + (cw - size) / 2 + rand(-4, 4);
  const isT = b.since >= 2 || Math.random() < 0.38; b.since = isT ? 0 : b.since + 1;
  const L = isT ? G.L : distractor(lvl);
  const e = el('button', 'bal', '<i class="ar" lang="ar">' + L.ch + '</i>'); e.type = 'button';
  e.setAttribute('aria-label', L.name);
  e.style.width = size + 'px'; e.style.height = h + 'px'; e.style.fontSize = (size * 0.46) + 'px';
  e.style.setProperty('--bc', pick(BAL_COLORS));
  const o = { e:e, x:x, y:b.h + 6, h:h, L:L, ph:rand(0, 6.28), dead:false, ttl:0 };
  e.style.transform = 'translate3d(' + x + 'px,' + o.y + 'px,0)';

function hitBalloon(lane, o){

/* ---------- game 3: memory match ---------- */
function gridFit(n, w, h, ratio, gap){
  let best = { size:0, cols:1 };
  for (let c = 1; c <= n; c++) {
    if (n % c) continue;
    const r = n / c, cw = (w - gap * (c - 1)) / c, ch = (h - gap * (r - 1)) / r;
    const s = Math.min(cw, ch * ratio);
    if (s > best.size) best = { size:s, cols:c };
  }
  return best;
}
function matchSize(lane){
  const m = lane.m, w = lane.body.clientWidth - 24, h = lane.body.clientHeight - 30;
  const gap = Math.max(6, Math.min(w, h) * 0.03), f = gridFit(m.count, w, h, 0.78, gap), cs = Math.max(30, Math.min(f.size, 240));
  m.grid.style.setProperty('--cs', cs + 'px'); m.grid.style.gap = gap + 'px';
  m.grid.style.gridTemplateColumns = 'repeat(' + f.cols + ',' + cs + 'px)';
}
function flipCard(lane, c){
  const m = lane.m;
  if (lane.done || clock.paused || G.roundOver || m.busy || c.open || c.got) return;
  c.open = true; c.e.classList.add('open'); sfx.flip(); m.open.push(c);
  if (m.open.length < 2) return;
  const a = m.open[0], b = m.open[1];
  if (a.L === b.L) {
    m.open = []; a.got = b.got = true; m.got++;
    a.e.classList.add('got'); b.e.classList.add('got');
    addScore(lane, 10); floatAt(lane, b.e, '+10'); sfx.good();
    if (m.got === m.n) {
      lane.done = true;
      let pts = 10, msg = 'All pairs found!';
      if (firstBonus()) { pts = 20; msg = 'First to finish!'; }
      addScore(lane, pts);
      toast(lane, '<div class="big">🎉</div><div>' + msg + ' +' + pts + '</div>');
      allDone();
    }
  } else {
    m.busy = true;
    after(900, () => { a.open = b.open = false; a.e.classList.remove('open'); b.e.classList.remove('open'); m.open = []; m.busy = false; });
  }
}

function trainSize(lane){

function placeTile(lane, slot, tile, free){
  slot.filled = true; slot.e.classList.add('full');
  tile.style.transform = ''; tile.classList.remove('drag'); tile.classList.add('placed');
  slot.e.appendChild(tile);
  if (free) return;
  addScore(lane, 10); floatAt(lane, slot.e, '+10'); sfx.good();
  if (lane.tr.slots.every(s => s.filled)) {
    lane.done = true;
    let pts = 10, msg = 'All aboard!';
    if (firstBonus()) { pts = 20; msg = 'First to finish!'; }
    addScore(lane, pts); sfx.choo();
    lane.tr.train.classList.add('go');

  }

function makeTile(lane, L){
  const e = el('div', 'tn-tile ar'); e.textContent = L.ch; e.setAttribute('lang', 'ar');
  let d = null;
  const nope = () => { sfx.bad(); e.classList.remove('no'); void e.offsetWidth; e.classList.add('no'); };
  e.addEventListener('pointerdown', ev => {
    if (d || lane.done || clock.paused || G.roundOver || e.classList.contains('placed')) return;
    ev.preventDefault(); try { e.setPointerCapture(ev.pointerId); } catch (err) {}
    d = { id:ev.pointerId, sx:ev.clientX, sy:ev.clientY, moved:false };
    e.classList.remove('no'); e.classList.add('drag');
  });
  e.addEventListener('pointermove', ev => {
    if (!d || ev.pointerId !== d.id) return;
    const dx = ev.clientX - d.sx, dy = ev.clientY - d.sy;
    if (Math.abs(dx) + Math.abs(dy) > 10) d.moved = true;
    e.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.08)';
  });
  const end = ev => {
    if (!d || ev.pointerId !== d.id) return;
    const moved = d.moved; d = null;
    const slots = lane.tr.slots; let slot = null;
    if (moved) {
      const r = e.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      slot = slots.filter(s => { const q = s.e.getBoundingClientRect(); return cx > q.left - 8 && cx < q.right + 8 && cy > q.top - 24 && cy < q.bottom + 24; })[0] || null;
    } else {

  rs.forEach((r, k) => { if (k === 0 || r.score < rs[k - 1].score) rank = k + 1; r.rank = rank; });

const PENS = ['ink','#E8344E','#2F6BFF','#17A566','#F59A0B','#9B4DFF'];
const SIZES = [5, 11, 22];
const B = { strokes:[], active:new Map(), pen:0, size:1, erase:false, solid:false, guide:false, gi:0, cv:$('#bd-cv'), ctx:null, w:0, h:0, dpr:1, ox:0, oy:0, k:1 };

const penColor = c => c === 'ink' ? cssVar('--ink') : c;
function boardUI(){

function boardSize(){

  B.k = clamp(Math.min(B.w, B.h) / 600, 1, 2.6);

}

  B.strokes.push(s); B.active.set(e.pointerId, s); boardStyle(s); strokePath(B.ctx, s.pts, 1);
});

  const s = B.active.get(e.pointerId); if (!s) return;
  boardStyle(s);
  coalesced(e).forEach(ev => { const p = { x:ev.clientX - B.ox, y:ev.clientY - B.oy }, a = s.pts[s.pts.length - 1]; B.ctx.beginPath(); B.ctx.moveTo(a.x, a.y); B.ctx.lineTo(p.x, p.y); B.ctx.stroke(); s.pts.push(p); });
});

  /* play: engine */
  function newGame(){
    const s = N.setup, n = s.count, total = n * s.rounds, pool = poolOf(s.range).map(l => l.ch);
    let deck = [], kinds = [];
    while (deck.length < total) { const d = shuffle(pool); if (deck.length && d[0] === deck[deck.length - 1]) d.push(d.shift()); deck = deck.concat(d); }
    while (kinds.length < total) kinds = kinds.concat(s.kind === 'mix' ? shuffle(['find','form','word','say']) : [s.kind]);
    N.game = {n:n, total:total, turn:0, deck:deck.slice(0, total), kinds:kinds.slice(0, total), q:null, ans:null, missed:[], done:false, tip:false,
      players:s.players.slice(0, n).map((p, i) => ({name:p.name.trim() || ('Spieler ' + (i + 1)), avatar:p.avatar, color:COLORS[i], level:p.level, score:0}))};
    N.quit = false; makeQ();

  function makeQ(){
    const g = N.game, p = g.players[g.turn % g.n], l = BY[g.deck[g.turn]], kind = g.kinds[g.turn], hard = p.level === 'schwer', q = {kind:kind, ch:l.ch};
    g.ans = null; g.tip = false;
    if (kind === 'say') { q.twin = !!(hard && l.twin); }
    else {
      let word = null;
      if (kind === 'word') { word = pick(WORDS.filter(w => w[0].indexOf(l.ch) >= 0)); q.word = word; }
      if (kind === 'form') { q.pos = l.ch === 'و' ? 'rechts' : pick(['anfang','mitte','ende']); q.glyph = forms(l.ch)[q.pos === 'rechts' ? 'ende' : q.pos]; }
      const bad = c => c === l.ch || (word && norm(word[0]).indexOf(c) >= 0);
      const cand = hard ? shuffle(l.look.filter(c => !bad(c))) : [];
      const rest = shuffle(DL.map(x => x.ch).filter(c => !bad(c) && cand.indexOf(c) < 0 && (hard || l.look.indexOf(c) < 0)));
      q.opts = shuffle([l.ch].concat(cand.concat(rest).slice(0, (hard ? 4 : 3) - 1)));
    }
    g.q = q;
  }
  function answer(ok, choice){
    const g = N.game; if (g.ans) return;
    g.ans = {ok:ok, choice:choice || null};
    if (ok) { g.players[g.turn % g.n].score++; sfx.good(); }
    else { if (g.missed.indexOf(g.q.ch) < 0) g.missed.push(g.q.ch); sfx.bad(); }
  }
  function nextQ(){
    const g = N.game; if (!g.ans) return;
    g.turn++;
    if (g.turn >= g.total) { g.done = true; g.q = null; sfx.win(); confetti(); } else makeQ();
  }

    if (q.kind === 'find') { prompt = 'Finde diesen Buchstaben:'; stim = '<div class="dy-nm">' + esc(l.name) + '</div><p class="dy-cap">' + esc(l.sound) + '</p>'; }
    else if (q.kind === 'form') { prompt = 'Welcher Buchstabe ist das?'; stim = bd(q.glyph, 'lg') + '<p class="dy-cap">So sieht er ' + POS[q.pos] + ' aus.</p>'; }
    else if (q.kind === 'word') { prompt = 'Welcher Buchstabe steckt in diesem Wort?'; stim = bd(a ? hl(q.word[0], q.ch) : q.word[0], 'lg') + '<p class="dy-cap">' + esc(q.word[1]) + ' · ' + esc(q.word[2]) + '</p>'; }
    else {
      prompt = q.twin ? 'Sag beide Laute. Erst den roten, dann den anderen.' : 'Sag den Laut!';
      stim = bd(q.twin ? '<span class="dy-hl">' + l.ch + '</span>&nbsp;&nbsp;' + l.twin.ch : l.ch, 'lg') +
        (g.tip || a ? '<p class="dy-cap"><b>' + esc(l.name) + '</b>' + esc(l.sound) + ' ' + esc(l.tip) + '</p>' : '');
    }
    if (q.kind === 'say') {
      body = a ? '' : '<div class="dy-row sp"><button type="button" class="btn alt" data-act="tip"' + (g.tip ? ' disabled' : '') + '>Tipp zeigen</button>' +
        '<div class="dy-row"><span class="dy-hint">Für die Lehrkraft:</span><button type="button" class="btn alt" data-act="judge" data-v="0">Noch nicht</button><button type="button" class="btn" data-act="judge" data-v="1">Richtig</button></div></div>';
    } else {
      body = '<div class="dy-opts o' + q.opts.length + '" style="--o:' + q.opts.length + '">' + q.opts.map((c, i) => {
        let cls = '', mark = '';
        if (a) { if (c === q.ch) { cls = ' right'; mark = '<em aria-hidden="true">✓</em>'; } else if (c === a.choice) { cls = ' wrong'; mark = '<em aria-hidden="true">✗</em>'; } }
        return '<button type="button" class="dy-opt ar' + cls + '" data-act="pick" data-v="' + c + '" lang="ar"' + (a ? ' disabled' : '') + '>' + (a ? '' : '<kbd>' + (i + 1) + '</kbd>') + mark + c + '</button>';
      }).join('') + '</div>';
    }
    const fb = a ? '<div class="dy-fb ' + (a.ok ? 'ok' : 'no') + '" role="status">' + (a.ok ? 'Richtig! Das ist ' : 'Noch nicht. Richtig ist ') + A(l.ch) + ' – ' + esc(l.name) + '.</div>' : '';
    const last = g.turn === g.total - 1;
    const quit = N.quit ? '<span class="dy-row"><span class="dy-hint">Wirklich beenden?</span><button type="button" class="btn alt" data-act="quit-yes">Ja</button><button type="button" class="btn alt" data-act="quit-no">Nein</button></span>'
      : '<button type="button" class="btn alt" data-act="quit">Spiel beenden</button>';
    return scores + '<div class="panel dy-stage" style="--pc:' + p.color + '">' +
      '<div class="dy-row sp"><span class="dy-eye">Frage ' + (g.turn + 1) + ' von ' + g.total + '</span><span class="dy-eye">' + KINDS[q.kind][0] + ' · ' + p.level + '</span></div>' +
      '<p class="dy-turn">' + p.avatar + ' ' + esc(p.name) + ', du bist dran!</p>' +
      '<p class="dy-prompt">' + prompt + '</p><div class="dy-stim">' + stim + '</div>' + body + fb +
      '<div class="dy-row sp">' + quit + (a ? '<button type="button" class="btn xl" id="dy-weiter" data-act="next">' + (last ? 'Zum Ergebnis' : 'Weiter') + '</button>' : '') + '</div></div>';
  }
  function vEnd(){
    const g = N.game, ord = g.players.map((p, i) => ({p:p, i:i})).sort((x, y) => y.p.score - x.p.score);
    let rank = 0, prev = null;
    const list = ord.map((o, k) => {
      if (o.p.score !== prev) { rank = k + 1; prev = o.p.score; }
      return '<li style="--pc:' + o.p.color + '"><span class="pos">' + rank + '. Platz</span><span class="av" aria-hidden="true">' + o.p.avatar + '</span><span class="nm">' + esc(o.p.name) + '</span><span class="pts">' + o.p.score + (o.p.score === 1 ? ' Stern' : ' Sterne') + '</span></li>';
    }).join('');
    const miss = g.missed.length ? '<p class="dy-lede">Tipp auf einen Buchstaben. Dann lernen wir ihn noch einmal.</p><div class="dy-strip" dir="rtl">' + g.missed.map(c =>
        '<button type="button" class="dy-lt ar" data-act="practice" data-v="' + c + '" lang="ar" aria-label="' + esc(BY[c].name) + '">' + c + '</button>').join('') + '</div>'
      : '<p class="dy-lede">Alle Buchstaben waren richtig. Super!</p>';
    return '<div class="dy-head"><h1>Fertig!</h1><p class="dy-lede">' + g.total + ' Fragen sind geschafft.</p></div><ol class="dy-rank">' + list + '</ol>' +
      '<div class="panel dy-stack"><h2>Das üben wir noch</h2>' + miss + '</div>' +
      '<div class="dy-row"><button type="button" class="btn xl" data-act="start">Nochmal spielen</button><button type="button" class="btn alt" data-act="quit-yes">Spiel ändern</button></div>';
  }

  /* render + events */
  const root = $('#neu'), V = $('#n-view'), homeBtn = $('#n-home');
  let armT2 = 0;
  function disarm2(){ clearTimeout(armT2); homeBtn.classList.remove('arm'); homeBtn.textContent = '🏠'; }
  function render(){
    $$('.dy-seg button', root).forEach(b => { const on = b.getAttribute('data-v') === N.view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    V.innerHTML = '<div class="dy">' + (N.view === 'lernen' ? vLernen() : (N.game ? vGame() : vSetup())) + '</div>';
  }
  function open(view){ N.view = view; disarm2(); show('neu'); render(); V.scrollTop = 0; }
  function leave(){ disarm2(); try { window.speechSynthesis.cancel(); } catch (e) {} $('#confetti').innerHTML = ''; show('home'); }
  homeBtn.addEventListener('click', () => {
    const running = N.view === 'spielen' && N.game && !N.game.done;
    if (!running || homeBtn.classList.contains('arm')) { leave(); return; }
    homeBtn.classList.add('arm'); homeBtn.textContent = 'Spiel verlassen?';
    armT2 = setTimeout(disarm2, 2600);
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.getAttribute('data-act'), v = b.getAttribute('data-v'), s = N.setup, g = N.game;
    let top = false;
    if (act === 'view') { N.view = v; top = true; }
    else if (act === 'tab') { N.tab = v; }
    else if (act === 'range') { N.range = v; N.idx = 0; N.cards = null; }
    else if (act === 'go') { N.idx = +v; }
    else if (act === 'step') { N.idx = clamp(N.idx + (+v), 0, poolOf(N.range).length - 1); }
    else if (act === 'hide') { N.hide = !N.hide; }
    else if (act === 'open') { N.cardOpen = true; }
    else if (act === 'card') { if (N.cardAt >= N.cards.length - 1) dealCards(); else { N.cardAt++; N.cardOpen = false; } }
    else if (act === 'speak') { speak(v); return; }
    else if (act === 'write') { B.gi = Math.max(0, LETTERS.findIndex(x => x.ch === v)); B.guide = true; B.solid = true; openBoard(); return; }
    else if (act === 'count') { s.count = +v; saveN(); }
    else if (act === 'av') {
      const p = s.players[+b.getAttribute('data-i')], used = s.players.slice(0, s.count).map(x => x.avatar);
      let k = AVATARS.indexOf(p.avatar);
      for (let n = 0; n < AVATARS.length; n++) { k = (k + 1) % AVATARS.length; if (used.indexOf(AVATARS[k]) < 0) { p.avatar = AVATARS[k]; break; } }
      saveN();
    }
    else if (act === 'level') { s.players[+b.getAttribute('data-i')].level = v; saveN(); }
    else if (act === 'kind') { s.kind = v; saveN(); }
    else if (act === 'srange') { s.range = v; saveN(); }
    else if (act === 'rounds') { s.rounds = +v; saveN(); }
    else if (act === 'start') { $('#confetti').innerHTML = ''; audio(); newGame(); top = true; }
    else if (act === 'pick') { answer(v === g.q.ch, v); }
    else if (act === 'judge') { answer(v === '1'); }
    else if (act === 'tip') { g.tip = true; }
    else if (act === 'next') { nextQ(); top = true; }
    else if (act === 'quit') { N.quit = true; }
    else if (act === 'quit-no') { N.quit = false; }
    else if (act === 'quit-yes') { $('#confetti').innerHTML = ''; N.game = null; N.quit = false; top = true; }
    else if (act === 'practice') { $('#confetti').innerHTML = ''; N.range = 'alle'; N.idx = DL.indexOf(BY[v]); N.tab = 'buchstaben'; N.view = 'lernen'; top = true; }
    else return;
    render();
    if (top) V.scrollTop = 0;
    const w = $('#dy-weiter'); if (w && (act === 'pick' || act === 'judge')) w.focus();
  });
  root.addEventListener('input', e => {
    if (e.target.classList.contains('pc-name')) { N.setup.players[+e.target.getAttribute('data-i')].name = e.target.value.slice(0, 12); saveN(); }
  });
  document.addEventListener('keydown', e => {
    if (root.hidden || !$('#board').hidden || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
    const g = N.game;
    if (N.view === 'spielen' && g && !g.done) {
      if (!g.ans && g.q.opts && /^[1-4]$/.test(e.key)) {
        const c = g.q.opts[+e.key - 1];
        if (c) { answer(c === g.q.ch, c); render(); const w = $('#dy-weiter'); if (w) w.focus(); }
      }
    } else if (N.view === 'lernen' && N.tab === 'buchstaben' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      /* the alphabet runs right to left: the left arrow goes to the next letter */
      N.idx = clamp(N.idx + (e.key === 'ArrowLeft' ? 1 : -1), 0, poolOf(N.range).length - 1); render();
    }
  });
  return {open:open, state:() => N, letters:DL, where:where};
})();
$$('[data-neu]').forEach(b => b.addEventListener('click', () => NEU.open(b.getAttribute('data-neu'))));

/* ---------- global ---------- */
let rzT = 0;
function relayout(){ if (G && !$('#game').hidden && G.def.resize) G.def.resize(); if (!$('#board').hidden) boardSize(); }
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(relayout, 160); });
try { document.fonts.addEventListener('loadingdone', () => { if (G && G.id === 'trace' && !$('#game').hidden) relayout(); }); } catch (e) {}
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });

load(); renderHome(); setMuted(S.muted); fontsReady();
})();
</script>
</body>
</html>
