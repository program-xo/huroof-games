<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huroof Games: Arabic alphabet games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Sans+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F4FF; --bg2:#DCE3FF; --card:#FFFFFF; --ink:#1B2260; --muted:#5D638F; --line:#1B2260;
  --guide:#DDE2FF; --guide-edge:#96A2F2; --sky:#E2F3FF; --board:#FFFFFF; --shade:rgba(27,34,96,.22);
  --saffron:#F6B620; --turq:#1FB5A8; --pom:#F0607A; --blue:#3B4CCA; --on:#1B2260;
  --hl:#D92D52; --ok:#12754A; --ok-bg:#DDF6E7; --no:#8A4F00; --no-bg:#FFEFC7;
  --f-ui:"Baloo Bhaijaan 2","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-ar:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;
  --r:clamp(12px,1.7vmin,22px);
  --bw:3px;
  --gap:clamp(8px,1.3vmin,18px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10143F; --bg2:#232B7A; --card:#1C2266; --ink:#F1F4FF; --muted:#A9B0E6; --line:#060828;
    --guide:#2C3590; --guide-edge:#6470E0; --sky:#16205C; --board:#16403C; --shade:rgba(0,0,0,.4);
  --hl:#FF8FA3; --ok:#7BE3AE; --ok-bg:#123B2A; --no:#FFD06B; --no-bg:#45330A;
  }
}
:root[data-theme="dark"]{
  --bg:#10143F; --bg2:#232B7A; --card:#1C2266; --ink:#F1F4FF; --muted:#A9B0E6; --line:#060828;
  --guide:#2C3590; --guide-edge:#6470E0; --sky:#16205C; --board:#16403C; --shade:rgba(0,0,0,.4);
  --hl:#FF8FA3; --ok:#7BE3AE; --ok-bg:#123B2A; --no:#FFD06B; --no-bg:#45330A;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:clamp(15px,1.9vmin,24px);line-height:1.3;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2{margin:0;font-weight:800;line-height:1.1}
h2{font-size:1.15em}
.ar{font-family:var(--f-ar);font-weight:700;direction:rtl;unicode-bidi:isolate;line-height:1.25}
.screen{height:100%;display:flex;flex-direction:column}

/* shared pieces */
.btn{font-weight:700;color:var(--on);background:var(--saffron);border:var(--bw) solid var(--line);border-radius:999px;padding:.4em 1.1em;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.alt{background:var(--card);color:var(--ink)}
.ib{width:2.6em;height:2.6em;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:var(--bw) solid var(--line);border-radius:calc(var(--r)*.7);box-shadow:0 3px 0 var(--line);font-size:1em;padding:0;line-height:1}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.ib.sm{width:2.3em;height:2.3em}
.st{width:1em;height:1em;fill:var(--bg2);stroke:var(--line);stroke-width:1.6;stroke-linejoin:round;flex:0 0 auto}
.st.on{fill:var(--saffron)}
.top-btns{display:flex;gap:.5em;align-items:center}

/* home */
.home{overflow-y:auto;padding:var(--gap) clamp(12px,2.4vw,40px) calc(var(--gap)*1.5);gap:var(--gap)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1em}
.logo{display:flex;align-items:baseline;gap:.5em;line-height:1}
.logo-ar{font-family:var(--f-ui);font-weight:800;font-size:clamp(2.2em,7vmin,4.4em);color:var(--blue);direction:rtl}
.logo-en{font-weight:800;font-size:clamp(1.1em,2.6vmin,1.7em)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-ar{color:var(--saffron)}}
:root[data-theme="dark"] .logo-ar{color:var(--saffron)}
.home-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--gap)}
.setup{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.panel{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:clamp(10px,1.6vmin,20px)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-bottom:.6em}
.hint{color:var(--muted);font-size:.85em;margin:.6em 0 0;max-width:60ch}
.seg{display:flex;gap:.4em}
.seg button{width:2.4em;height:2.4em;border-radius:50%;background:var(--bg);border:var(--bw) solid var(--line);font-weight:800;padding:0}
.seg button.on{background:var(--blue);color:#fff}
#pcards{display:flex;flex-direction:column;gap:.6em}
.pcard{display:flex;align-items:center;gap:.7em;background:var(--bg);border:var(--bw) solid var(--line);border-left-width:14px;border-left-color:var(--pc);border-radius:calc(var(--r)*.8);padding:.5em .6em}
.pc-av{width:2.3em;height:2.3em;flex:0 0 auto;font-size:1.5em;border-radius:50%;background:var(--pc);border:var(--bw) solid var(--line);padding:0;line-height:1}
.pc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35em}
.pc-name{width:100%;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--muted);border-radius:.5em;padding:.2em .5em;-webkit-user-select:text;user-select:text}
.pc-name::placeholder{color:var(--muted);opacity:1}
.pc-lv{display:flex;gap:.3em;flex-wrap:wrap}
.pc-lv button{flex:1 1 auto;font-size:.82em;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.15em .6em;white-space:nowrap}
.pc-lv button.on{background:var(--blue);color:#fff}
.pc-col{width:2em;height:2em;flex:0 0 auto;border-radius:50%;background:var(--pc);border:var(--bw) solid var(--line);padding:0;position:relative}
.pc-col::after{content:"";position:absolute;top:50%;left:50%;width:.55em;height:.55em;margin:-.275em 0 0 -.275em;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.settings h2{margin-bottom:.45em}
.settings h2 + .chips{margin-bottom:.9em}
.settings .chips:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:.45em}
.chip{font-weight:700;background:var(--bg);border:var(--bw) solid var(--line);border-radius:999px;padding:.25em .9em;min-height:2.3em}
.chip.on{background:var(--blue);color:#fff}
.chip .ar{font-size:1.1em}
.games{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:var(--gap);min-width:0}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;text-align:left;min-height:9em;background:var(--gc);color:var(--on);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 6px 0 var(--line);padding:clamp(12px,2vmin,26px)}
.gcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.g-art{align-self:flex-end;margin-top:-.12em;font-size:clamp(3em,13vmin,8em);line-height:1.15;display:flex;align-items:center;gap:.08em}
.g-art .ar{color:var(--on);opacity:.9;line-height:1.15}
.g-art .em{font-size:.5em}
.g-name{margin-top:auto;font-weight:800;font-size:clamp(1.3em,3.2vmin,2em);line-height:1.05}
.g-desc{font-size:.9em;font-weight:500;max-width:22ch}
@media (max-width:820px),(orientation:portrait){
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .games{grid-auto-rows:auto}
}

/* game screen */
.gbar{display:flex;align-items:center;gap:.7em;padding:.45em clamp(8px,1.2vw,18px);background:var(--card);border-bottom:var(--bw) solid var(--line)}
.g-mid{flex:1;min-width:0;display:flex;align-items:baseline;gap:.8em;overflow:hidden;white-space:nowrap}
#g-title{font-weight:800;font-size:1.2em;overflow:hidden;text-overflow:ellipsis}
#g-prompt{color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
#g-prompt .ar{color:var(--ink);font-size:1.35em;padding:0 .15em}
#g-prompt b{color:var(--ink)}
#g-round{font-weight:800;background:var(--bg2);border-radius:999px;padding:.15em .8em;white-space:nowrap}
#g-home.arm{width:auto;padding:0 .8em;background:var(--pom);color:var(--on);font-weight:700}
.tbar{height:clamp(8px,1.1vmin,14px);background:var(--bg2);border-bottom:2px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--saffron);transform-origin:left center}
#lanes{flex:1;min-height:0;display:flex;gap:var(--gap);padding:var(--gap);padding-bottom:calc(var(--gap) + 4px);touch-action:none}
.lane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line)}
.lane-head{display:flex;align-items:center;gap:.5em;padding:.25em .7em;background:var(--pc);color:var(--on);border-bottom:var(--bw) solid var(--line);font-weight:800}
.lane-head .av{font-size:1.45em;line-height:1}
.lane-head .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-head .sc{display:inline-flex;align-items:center;gap:.3em;background:#fff;color:var(--on);border:2px solid var(--on);border-radius:999px;padding:0 .6em;font-size:1.1em}
.lane-head .sc .st{fill:var(--saffron);stroke:var(--on)}
.lane-head .sc.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.3)}}
.lane-body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);z-index:35;pointer-events:none;text-align:center;font-weight:800;background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 5px 0 var(--line);padding:.5em 1em;white-space:nowrap;animation:toast .3s cubic-bezier(.3,1.5,.6,1)}
.toast .big{font-size:2.2em;line-height:1.1;display:flex;justify-content:center;gap:.1em}
@keyframes toast{from{transform:translateX(-50%) scale(.5);opacity:0}}
.fl{position:absolute;z-index:36;pointer-events:none;font-weight:800;font-size:1.6em;color:var(--ink);text-shadow:0 2px 0 var(--card),0 -2px 0 var(--card),2px 0 0 var(--card),-2px 0 0 var(--card);transform:translate(-50%,-50%);animation:fl .9s ease-out forwards;white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-220%);opacity:0}}
@media (orientation:portrait){#lanes{flex-direction:column}#lanes.n4{flex-direction:row;flex-wrap:wrap}#lanes.n4 .lane{flex:1 1 40%}}
@media (max-width:640px){
  #g-prompt{display:none}
  .gbar{gap:.4em}
  .gbar .top-btns{gap:.3em}
  .gbar .ib{width:2.3em;height:2.3em}
}

/* trace */
.tc-wrap{flex:1;min-height:0;position:relative}
.tc-cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tc-tip{position:absolute;left:50%;bottom:.5em;transform:translateX(-50%);background:var(--saffron);color:var(--on);font-weight:700;font-size:.9em;border:2px solid var(--line);border-radius:999px;padding:.1em .9em;white-space:nowrap;pointer-events:none}
.tools{display:flex;align-items:center;gap:.5em;padding:.45em .6em;border-top:var(--bw) solid var(--line);background:var(--bg)}
.tools .sp{flex:1}
.meter{display:flex;gap:.15em;font-size:1.9em}

/* balloons */
.pp-target{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.4em;min-height:2.6em;padding:.15em .6em;border-bottom:var(--bw) solid var(--line);background:var(--bg);font-weight:800;font-size:1.5em}
.pp-target .ar{font-size:1.5em}
.pp-sky{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sky);transition:opacity .15s}
.lane.oops .pp-sky{opacity:.45}
.bal{position:absolute;top:0;left:0;background:none;border:0;padding:0;touch-action:none;will-change:transform}
.bal::after{content:"";position:absolute;left:50%;top:86%;width:2px;height:22%;margin-left:-1px;background:var(--muted)}
.bal i{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;height:84%;border-radius:50% 50% 50% 50%/46% 46% 54% 54%;background:var(--bc);border:var(--bw) solid var(--line);box-shadow:inset -.14em -.16em 0 rgba(27,34,96,.16);color:#1B2260;font-style:normal;padding-bottom:.12em}
.bal i::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:9px;margin-left:-7px;background:var(--bc);border:var(--bw) solid var(--line);border-top:0;border-radius:0 0 7px 7px}
.bal.hit i{animation:pop .3s forwards}
.bal.miss i{animation:miss .45s forwards;background:#B9BED6}
@keyframes pop{40%{transform:scale(1.25);opacity:1}100%{transform:scale(1.7);opacity:0}}
@keyframes miss{20%{transform:translateX(-8px)}50%{transform:translateX(8px)}80%{transform:translateX(-4px);opacity:1}100%{opacity:0}}

/* memory */
.mm-grid{flex:1;min-height:0;display:grid;justify-content:center;align-content:center;padding:12px}
.mm-card{width:var(--cs);height:calc(var(--cs)/.78);background:none;border:0;padding:0;-webkit-perspective:700px;perspective:700px}
.mm-in{position:relative;display:block;width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .35s}
.mm-card.open .mm-in{transform:rotateY(180deg)}
.mm-back,.mm-front{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:var(--bw) solid var(--line);border-radius:calc(var(--cs)*.12);-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 4px 0 var(--line)}
.mm-back{background:var(--pc);font-size:calc(var(--cs)*.5)}
.mm-back .st{fill:#fff;stroke:var(--on)}
.mm-front{background:var(--card);color:var(--ink);transform:rotateY(180deg);gap:calc(var(--cs)*.02)}
.mm-front .big{font-size:calc(var(--cs)*.56);line-height:1.2}
.mm-front .nmc{font-size:calc(var(--cs)*.26);font-weight:800;text-align:center;line-height:1.05;max-width:100%;padding:0 .08em}
.mm-front .nmc.sm{font-size:calc(var(--cs)*.16)}
.mm-card.got .mm-front{background:var(--pc);color:var(--on);animation:got .4s}
@keyframes got{50%{transform:rotateY(180deg) scale(1.08)}}

/* train */
.tn-track{flex:1 1 45%;min-height:0;display:flex;align-items:flex-end;justify-content:center;position:relative;padding:0 12px 14px;background:var(--sky)}
.tn-track::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;border-top:5px solid var(--line);background:repeating-linear-gradient(90deg,var(--muted) 0 10px,transparent 10px 26px)}
.tn-train{display:flex;flex-direction:row-reverse;align-items:flex-end;gap:calc(var(--ts)*.1);transition:transform 1.8s cubic-bezier(.55,0,.9,.5)}
.tn-train.go{transform:translateX(100vw)}
.tn-engine{font-size:calc(var(--ts)*1.05);line-height:1;transform:scaleX(-1);margin-bottom:calc(var(--ts)*.06)}
.tn-slot{width:var(--ts);height:var(--ts);flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--ts)*.24);background:var(--card);border:var(--bw) dashed var(--muted);border-radius:calc(var(--ts)*.18)}
.tn-slot::before,.tn-slot::after{content:"";position:absolute;bottom:calc(var(--ts)*-.27);width:calc(var(--ts)*.24);height:calc(var(--ts)*.24);border-radius:50%;background:var(--line);border:2px solid var(--muted)}
.tn-slot::before{left:10%}
.tn-slot::after{right:10%}
.tn-slot.full{border-style:solid;border-color:var(--line)}
.tn-slot .ghost{font-size:calc(var(--ts)*.5);color:var(--muted);opacity:.45}
.tn-slot.full .ghost{display:none}
.tn-tray{flex:1 1 55%;min-height:0;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:calc(var(--ts)*.22);padding:12px}
.tn-tile{width:calc(var(--ts)*.94);height:calc(var(--ts)*.94);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(var(--ts)*.18);box-shadow:0 4px 0 var(--line);font-size:calc(var(--ts)*.5);touch-action:none;cursor:grab;position:relative;transition:transform .2s;padding-bottom:.1em}
.tn-tile.drag{transition:none;z-index:40;box-shadow:0 12px 0 var(--shade);cursor:grabbing}
.tn-tile.no{animation:no .35s}
@keyframes no{25%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
.tn-tile.placed{position:absolute;top:0;left:0;width:100%;height:100%;border:0;box-shadow:none;background:var(--pc);color:var(--on);border-radius:inherit;pointer-events:none;animation:got2 .3s}
@keyframes got2{50%{transform:scale(1.15)}}

/* podium */
#podium{align-items:center;justify-content:center;gap:calc(var(--gap)*1.5);padding:var(--gap);text-align:center;overflow-y:auto}
#p-title{font-size:clamp(1.8em,6vmin,3.6em)}
#p-stand{display:flex;align-items:flex-end;justify-content:center;gap:var(--gap);width:min(94%,56em)}
.pod{flex:1;max-width:14em;display:flex;flex-direction:column;align-items:center;min-width:0}
.pod-av{font-size:clamp(2.4em,9vmin,5em);line-height:1.1}
.pod-crown{font-size:clamp(1.4em,5vmin,2.8em);line-height:1;margin-bottom:-.15em}
.pod-nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:.3em}
.pod-blk{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.1em;padding:.5em .3em;background:var(--pc);color:var(--on);border:var(--bw) solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;font-weight:800}
.pod-sc{display:flex;align-items:center;gap:.25em;font-size:1.7em}
.pod-sc .st{fill:#fff;stroke:var(--on)}
.pod-rk{font-size:1em}
.pod.r1 .pod-blk{height:clamp(8em,30vmin,15em)}
.pod.r2 .pod-blk{height:clamp(6em,22vmin,11em)}
.pod.r3 .pod-blk{height:clamp(4.6em,15vmin,8em)}
.pod.r4 .pod-blk{height:clamp(3.6em,10vmin,5.6em)}
.p-btns{display:flex;gap:1em;flex-wrap:wrap;justify-content:center;font-size:1.2em}
#confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:80}
#confetti i{position:absolute;top:-4vh;width:1.4vmin;height:2.4vmin;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* whiteboard */
#board{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:rgba(120,130,200,.12)}
#board.solid{background:var(--board)}
#bd-cv{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bd-guide{position:absolute;top:0;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:var(--guide-edge)}
#bd-guide .ar{font-size:min(52vh,60vw);line-height:1.3;opacity:.55}
#bd-guide b{font-size:1.6em;color:var(--muted)}
#bd-tools{position:absolute;left:50%;bottom:calc(var(--gap) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4em .5em;max-width:calc(100% - 16px);width:max-content;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:.45em .6em}
#bd-tools .grp{display:flex;align-items:center;gap:.35em}
#bd-tools .sep{width:2px;align-self:stretch;background:var(--bg2)}
.pen{width:2.1em;height:2.1em;border-radius:50%;border:var(--bw) solid var(--line);padding:0;background:var(--pcol)}
.pen.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--blue)}
.sz{width:2.1em;height:2.1em;border-radius:50%;border:2px solid var(--muted);background:var(--bg);padding:0;display:inline-flex;align-items:center;justify-content:center}
.sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink)}
.sz.on{border-color:var(--blue);border-width:4px}
#bd-tools .ib{font-size:.9em}
#bd-tools .ib.on{background:var(--blue);color:#fff}
#bd-letter{font-size:1.2em;width:2.2em;height:2.2em;padding-bottom:.15em}

/* home: new section + closed old section */
.new-sec{flex:1 0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2em .6em}
.sec-h p{margin:0;color:var(--muted);font-weight:500;font-size:.9em}
.tag-new{flex:0 0 auto;background:var(--pom);color:var(--on);border:var(--bw) solid var(--line);border-radius:999px;box-shadow:0 2px 0 var(--line);padding:0 .7em;font-weight:800;font-size:.9em}
.new-cards{display:grid;gap:var(--gap)}
.new-cards.teach{flex:1.2;grid-template-columns:repeat(3,minmax(0,1fr))}
.new-cards.play{flex:1;grid-template-columns:repeat(5,minmax(0,1fr))}
.new-cards .gcard{position:relative;min-height:7em}
.new-cards.teach .g-art{font-size:clamp(2.6em,11vmin,6.5em)}
.new-cards.teach .g-name{font-size:clamp(1.7em,5vmin,3em)}
.new-cards.teach .g-desc{font-size:1.05em;max-width:30ch}
.new-cards.play .g-art{font-size:clamp(2.2em,8vmin,4.6em)}
.new-cards.play .g-name{font-size:clamp(1.1em,2.5vmin,1.55em)}
.new-cards.play .g-desc{font-size:.8em}
.g-tag{position:absolute;top:.7em;left:.8em;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:0 .6em;font-size:.8em;font-weight:800}
.old-sec{flex:0 0 auto}
.old-sec summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.6em;font-weight:800;font-size:1.15em;background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:.5em .9em}
.old-sec summary::-webkit-details-marker{display:none}
.old-sec summary::before{content:"";flex:0 0 auto;width:0;height:0;border-left:.55em solid var(--ink);border-top:.4em solid transparent;border-bottom:.4em solid transparent;transition:transform .2s}
.old-sec[open] summary::before{transform:rotate(90deg)}
.old-sec summary span{margin-left:auto;color:var(--muted);font-weight:500;font-size:.8em}
.old-sec .home-grid{margin-top:var(--gap)}
@media (max-width:820px),(orientation:portrait){
  .new-cards.play,.new-cards.teach{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}

/* new mode: Dad bis Ya */
#neu .gbar{flex-wrap:wrap}
#n-title{font-weight:800;font-size:1.2em;white-space:nowrap}
.dy-fill{flex:1}
.dy-seg{display:flex;gap:.35em}
.dy-seg button{font-weight:800;background:var(--bg);border:var(--bw) solid var(--line);border-radius:999px;padding:.15em 1em;min-height:2.3em}
.dy-seg button.on{background:var(--blue);color:#fff}
#n-view{flex:1;min-height:0;overflow-y:auto;padding:calc(var(--gap)*1.2) clamp(16px,2.4vw,40px) calc(var(--gap)*2.5)}
.dy{display:flex;flex-direction:column;gap:calc(var(--gap)*1.4);max-width:66em;margin:0 auto}
.dy p{margin:0}
.dy-row{display:flex;flex-wrap:wrap;gap:.45em;align-items:center}
.dy-row.sp{justify-content:space-between}
.dy-row.c{justify-content:center}
.dy-lede{color:var(--muted);max-width:60ch}
.dy-eye{font-size:.9em;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dy-stack{display:flex;flex-direction:column;gap:.6em}
.dy-hint{color:var(--muted);font-size:.9em}
.dy .btn.xl{font-size:1.4em;padding:.45em 1.5em}
.dy .btn:disabled{opacity:.35;cursor:default}

/* letter boards */
.dy-bd{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);overflow:hidden;padding:0 .4em;min-width:0}
.dy-ink{display:block;text-align:center;line-height:1.65;color:var(--ink)}
.dy-bd.xxl .dy-ink{font-size:clamp(7em,36vmin,16em)}
.dy-bd.xl .dy-ink{font-size:clamp(6em,29vmin,13em)}
.dy-bd.lg .dy-ink{font-size:clamp(4.5em,18vmin,8.5em)}
.dy-bd.md .dy-ink{font-size:2.9em}
.dy-bd.pr .dy-ink{font-size:4em}
.dy-hl{color:var(--hl)}

/* learn */
.dy-strip{display:flex;flex-wrap:wrap;gap:.4em}
.dy-lt{width:2.1em;height:2.2em;font-size:1.3em;background:var(--card);border:var(--bw) solid var(--line);border-radius:.45em;box-shadow:0 3px 0 var(--line);padding:0 0 .25em;line-height:1}
.dy-lt.on{background:var(--saffron);color:var(--on)}
.dy-lcard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(var(--gap)*2);align-items:center}
.dy-info{display:flex;flex-direction:column;gap:.5em;min-width:0}
.dy-info h1{font-size:clamp(2.6em,9vmin,4.6em)}
.dy-sound{font-size:1.5em;font-weight:700;line-height:1.2}
.dy-tip{color:var(--muted)}
.dy-twin{display:flex;flex-wrap:wrap;align-items:center;gap:.1em .5em;color:var(--muted)}
.dy-twin .ar{font-size:1.9em;line-height:1.2;color:var(--ink)}
.dy-twin .dy-hl{color:var(--hl)}
.dy-nav{margin-top:.4em}
.dy-nav .btn{flex:1;font-size:1.25em}
.dy-g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.dy-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.dy-tile{display:flex;flex-direction:column;gap:.3em;min-width:0;background:none;border:0;padding:0;text-align:inherit}
.dy-tile .dy-bd{box-shadow:none}
.dy-cap{font-size:.9em;color:var(--muted);text-align:center}
.dy-cap b{color:var(--ink);font-size:1.15em}
.dy-pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:var(--gap)}
.dy-pair{display:flex;flex-direction:column;gap:.4em}
.dy-two{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.dy-side{display:flex;flex-direction:column;gap:.1em;text-align:center;min-width:0}
.dy-side .dy-bd{box-shadow:none;background:var(--bg)}
.dy-side b{font-weight:800}
.dy-side i{font-style:normal;font-size:.9em;color:var(--muted)}
.dy-hide .dy-side b,.dy-hide .dy-side i{visibility:hidden}
.dy-head{display:flex;flex-direction:column;gap:.15em}
.dy-head h1{font-size:clamp(1.8em,5vmin,2.8em)}
.dy-dua{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:0 4px 0 var(--line);padding:.6em 1em;text-align:center}
.dy-dua-ar{font-size:clamp(2em,7.5vmin,4em);line-height:1.9}
.dy-dua-tr{font-size:clamp(1.1em,3.2vmin,1.7em);font-weight:700;line-height:1.4;margin-top:.2em}
.dy-dua .off{opacity:.22}
.dy-dua-ar .cur{color:var(--hl)}
.dy-mean{display:flex;flex-direction:column;gap:.3em}
.dy-mean-tx{font-size:1.35em;font-weight:700;line-height:1.25;max-width:50ch}
.dy-words summary{cursor:pointer;font-weight:800;padding:.3em 0}
.dy-words .dy-g4{margin-top:.5em}
.dy-bd.wd .dy-ink{font-size:2em;line-height:1.9}
.dy-flash{display:flex;flex-direction:column;gap:var(--gap);max-width:36em;width:100%;margin:0 auto}
.dy-cardbtn{display:block;width:100%;background:none;border:0;padding:0}
.dy-reveal{min-height:4.6em;display:flex;flex-direction:column;justify-content:center;gap:.1em;text-align:center}
.dy-reveal b{font-size:2.6em;font-weight:800;line-height:1.1}
.dy-reveal span{font-size:1.2em}

@media (max-width:640px){
  .dy-lcard,.dy-g3{grid-template-columns:minmax(0,1fr)}
  .dy-g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  #neu .dy-seg{order:5;flex:1 0 100%}
  #neu .dy-seg button{flex:1;padding:.15em .4em}
}

/* quiz lanes (new games): sizes follow the lane through --qu */
.qz{flex:1;min-height:0;display:flex;flex-direction:column}
.qz-stim{flex:1 1 44%;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--qu)*.015);padding:calc(var(--qu)*.04);background:var(--sky);border-bottom:var(--bw) solid var(--line);text-align:center;overflow:hidden}
.qz-stim.ok{background:var(--ok-bg)}
.qz-stim.no,.qz-stim.late{background:var(--no-bg)}
.qz-big{font-size:calc(var(--qu)*.46);line-height:1.25;color:var(--ink)}
.qz-word{font-size:calc(var(--qu)*.3);line-height:1.4;color:var(--ink)}
.qz-name{font-size:calc(var(--qu)*.21);font-weight:800;line-height:1.05;max-width:100%}
.qz-cap{font-size:calc(var(--qu)*.062);font-weight:500;color:var(--muted);max-width:100%}
.qz-cap b{color:var(--ink)}
.qz-ic{position:absolute;top:.15em;left:.35em;font-size:calc(var(--qu)*.17);font-weight:800;line-height:1}
.qz-stim.ok .qz-ic{color:var(--ok)}
.qz-stim.no .qz-ic,.qz-stim.late .qz-ic{color:var(--no)}
.qz-stim.ok .qz-big,.qz-stim.no .qz-big,.qz-stim.late .qz-big{font-size:calc(var(--qu)*.36);line-height:1.2}
.qz-rn{font-size:calc(var(--qu)*.12);font-weight:800;line-height:1.1}
.qz-pts{font-size:calc(var(--qu)*.075);font-weight:800;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:0 .7em}
.qz-opts{flex:1 1 56%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-auto-rows:minmax(0,1fr);gap:calc(var(--qu)*.045);padding:calc(var(--qu)*.05)}
.qz-opt{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:calc(var(--qu)*.06);box-shadow:0 4px 0 var(--line);padding:0 0 .12em;font-size:calc(var(--qu)*.24);line-height:1.2;touch-action:none}
.qz-opt.txt{font-family:var(--f-ui);font-weight:800;font-size:calc(var(--qu)*.085);line-height:1.1;padding:.2em}
.qz-opt.txt.rd{font-size:calc(var(--qu)*.1)}
.qz-opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.qz-opt:disabled{cursor:default}
.qz-opt.right{background:var(--ok-bg);box-shadow:0 4px 0 var(--ok)}
.qz-opt.wrong{background:var(--no-bg);opacity:.7}

/* dua game lanes */
.du .qz-stim{flex:1 1 42%;gap:calc(var(--qu)*.015)}
.du.show .qz-stim{flex:1 1 62%}
.du .qz-ic{font-size:calc(var(--qu)*.12)}
.du-when{font-size:calc(var(--qu)*.055);font-weight:800;color:var(--muted)}
.du-chain{max-width:100%;font-size:calc(var(--qu)*.085);line-height:1.7;color:var(--ink)}
.du.show .du-chain{font-size:calc(var(--qu)*.105)}
.du-tr{max-width:100%;font-size:calc(var(--qu)*.055);font-weight:700;line-height:1.25}
.du-q{font-size:calc(var(--qu)*.15);font-weight:800;line-height:1;color:var(--hl)}
.du-opts{grid-template-columns:minmax(0,1fr);gap:calc(var(--qu)*.03)}
.du-opt{flex-direction:column;padding:.1em .3em;font-size:calc(var(--qu)*.06);line-height:1.2;overflow:hidden}
.du-opt .du-ar{font-size:calc(var(--qu)*.08);line-height:1.55;white-space:nowrap}
.du-opt .du-tr{font-size:calc(var(--qu)*.05);white-space:nowrap}
.du-de{font-size:calc(var(--qu)*.066);font-weight:700;line-height:1.2}
.du-de.big{font-size:calc(var(--qu)*.085);color:var(--ink)}
.du-mean{margin:auto;padding:0 .7em;text-align:center;font-size:calc(var(--qu)*.07);font-weight:700;line-height:1.3}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<section id="home" class="screen home">
  <header class="top">
    <div class="logo"><span class="logo-ar" lang="ar">حروف</span><span class="logo-en">Huroof Games</span></div>
    <div class="top-btns">
      <button type="button" class="ib board-btn" aria-label="Tafel öffnen">✏️</button>
      <button type="button" class="ib mute-btn" aria-label="Ton an oder aus">🔊</button>
      <button type="button" class="ib full-btn" aria-label="Vollbild">⛶</button>
    </div>
  </header>
  <section class="new-sec">
    <div class="sec-h"><span class="tag-new">Neu</span><h2>Dad bis Ya und Duas</h2><p>4 Spieler gleichzeitig</p></div>
    <div class="new-cards teach">
      <button type="button" class="gcard" data-neu="lernen" style="--gc:#8CC8FF">
        <span class="g-art" aria-hidden="true"><span class="em">👀</span><span class="ar">ض</span></span>
        <span class="g-name">Lernen</span><span class="g-desc">Schauen, hören, sprechen. Ohne Punkte.</span>
      </button>
      <button type="button" class="gcard" data-neu="duas" style="--gc:#8EDC9F">
        <span class="g-art" aria-hidden="true"><span class="em">🤲</span><span class="ar">دُعَاء</span></span>
        <span class="g-name">Duas</span><span class="g-desc">Schritt für Schritt. Für die Hausaufgabe.</span>
      </button>
      <button type="button" class="gcard" data-game="dua" style="--gc:#FFC93C">
        <span class="g-art" aria-hidden="true"><span class="em">🧩</span><span class="ar">اللّٰهُمَّ</span></span>
        <span class="g-name">Dua-Spiel</span><span class="g-desc">Teil für Teil. Wie geht die Dua weiter?</span>
      </button>
    </div>
    <div class="new-cards play">
      <button type="button" class="gcard" data-game="find" style="--gc:#FFD05C">
        <span class="g-art" aria-hidden="true"><span class="em">🔎</span><span class="ar">ع</span></span>
        <span class="g-name">Finde den Buchstaben</span><span class="g-desc">Lies den Namen. Tipp auf den Buchstaben.</span>
      </button>
      <button type="button" class="gcard" data-game="name" style="--gc:#FF8FA0">
        <span class="g-art" aria-hidden="true"><span class="em">❓</span><span class="ar">ط</span></span>
        <span class="g-name">Wie heißt er?</span><span class="g-desc">Schau den Buchstaben an. Tipp auf den Namen.</span>
      </button>
      <button type="button" class="gcard" data-game="form" style="--gc:#62D8CB">
        <span class="g-art" aria-hidden="true"><span class="em">🧩</span><span class="ar">ـغـ</span></span>
        <span class="g-name">Formen-Jagd</span><span class="g-desc">So sieht er im Wort aus. Wer ist das?</span>
      </button>
      <button type="button" class="gcard" data-game="word" style="--gc:#BDB0FF">
        <span class="g-art" aria-hidden="true"><span class="em">📖</span><span class="ar">ق</span></span>
        <span class="g-name">Wort-Jagd</span><span class="g-desc">Welcher Buchstabe steckt im Wort?</span>
      </button>
      <button type="button" class="gcard" data-game="read" style="--gc:#FFB26B">
        <span class="g-tag">Für Große</span>
        <span class="g-art" aria-hidden="true"><span class="ar">قَمَر</span></span>
        <span class="g-name">Wörter lesen</span><span class="g-desc">Lies das ganze Wort. Wie klingt es?</span>
      </button>
    </div>
  </section>
  <details class="old-sec">
    <summary>Alte Spiele <span>4 Spiele</span></summary>
  <div class="home-grid">
    <div class="setup">
      <div class="panel">
        <div class="panel-h"><h2>Wer spielt?</h2><div class="seg" id="count" role="group" aria-label="Anzahl Spieler"></div></div>
        <div id="pcards"></div>
        <p class="hint">Jedes Kind bekommt seine eigene Stufe. So können Kleine und Große zusammen spielen. Tipp auf ein Bild oder eine Farbe, um sie zu ändern.</p>
      </div>
      <div class="panel settings">
        <h2>Welche Buchstaben?</h2>
        <div class="chips" id="sets"></div>
        <h2>Wie lange?</h2>
        <div class="chips" id="lens"></div>
      </div>
    </div>
    <div class="games" id="games">
      <button type="button" class="gcard" data-game="trace" style="--gc:#BDB0FF">
        <span class="g-art" aria-hidden="true"><span class="em">✏️</span><span class="ar">ب</span></span>
        <span class="g-name">Nachschreiben</span><span class="g-desc">Fahr den großen Buchstaben nach und sammle Sterne.</span>
      </button>
      <button type="button" class="gcard" data-game="pop" style="--gc:#FF8FA0">
        <span class="g-art" aria-hidden="true"><span class="em">🎈</span><span class="ar">ت</span></span>
        <span class="g-name">Ballons</span><span class="g-desc">Lass alle Ballons mit dem richtigen Buchstaben platzen.</span>
      </button>
      <button type="button" class="gcard" data-game="match" style="--gc:#62D8CB">
        <span class="g-art" aria-hidden="true"><span class="em">🃏</span><span class="ar">ج</span></span>
        <span class="g-name">Memory</span><span class="g-desc">Dreh die Karten um und finde die Paare.</span>
      </button>
      <button type="button" class="gcard" data-game="train" style="--gc:#FFD05C">
        <span class="g-art" aria-hidden="true"><span class="em">🚂</span><span class="ar">د</span></span>
        <span class="g-name">Buchstaben-Zug</span><span class="g-desc">Zieh die Buchstaben der Reihe nach auf den Zug.</span>
      </button>
    </div>
  </div>
  </details>
</section>

<section id="game" class="screen" hidden>
  <header class="gbar">
    <button type="button" class="ib" id="g-home" aria-label="Zurück zum Start">🏠</button>
    <div class="g-mid"><span id="g-title"></span><span id="g-prompt"></span></div>
    <span id="g-round"></span>
    <div class="top-btns">
      <button type="button" class="ib" id="g-say" aria-label="Buchstaben noch einmal hören" hidden>🗣️</button>
      <button type="button" class="ib mute-btn" aria-label="Ton an oder aus">🔊</button>
      <button type="button" class="ib board-btn" aria-label="Tafel öffnen">✏️</button>
      <button type="button" class="ib full-btn" aria-label="Vollbild">⛶</button>
    </div>
  </header>
  <div class="tbar"><i id="g-time"></i></div>
  <div id="lanes"></div>
</section>

<section id="podium" class="screen" hidden>
  <h1 id="p-title"></h1>
  <div id="p-stand"></div>
  <div class="p-btns">
    <button type="button" class="btn" id="p-again">Nochmal</button>
    <button type="button" class="btn alt" id="p-menu">Zum Start</button>
  </div>
</section>

<section id="neu" class="screen" hidden>
  <header class="gbar">
    <button type="button" class="ib" id="n-home" aria-label="Zurück zum Start">🏠</button>
    <span id="n-title">Lernen</span>
    <div class="dy-seg" id="n-tabs" role="group" aria-label="Lern-Art">
      <button type="button" data-act="tab" data-v="buchstaben">Buchstaben</button>
      <button type="button" data-act="tab" data-v="paare">Paare</button>
      <button type="button" data-act="tab" data-v="karten">Karten</button>
    </div>
    <span class="dy-fill"></span>
    <div class="top-btns">
      <button type="button" class="ib mute-btn" aria-label="Ton an oder aus">🔊</button>
      <button type="button" class="ib board-btn" aria-label="Tafel öffnen">✏️</button>
      <button type="button" class="ib full-btn" aria-label="Vollbild">⛶</button>
    </div>
  </header>
  <div id="n-view"></div>
</section>

<div id="board" hidden>
  <div id="bd-guide" hidden><span class="ar" lang="ar"></span><b></b></div>
  <canvas id="bd-cv"></canvas>
  <div id="bd-tools">
    <div class="grp" id="bd-pens" role="group" aria-label="Stiftfarbe"></div>
    <span class="sep"></span>
    <div class="grp" id="bd-sizes" role="group" aria-label="Stiftgröße"></div>
    <span class="sep"></span>
    <div class="grp">
      <button type="button" class="ib" data-b="erase" aria-label="Radierer">🧽</button>
      <button type="button" class="ib" data-b="undo" aria-label="Zurück">↩️</button>
      <button type="button" class="ib" data-b="clear" aria-label="Tafel leeren">🗑️</button>
      <button type="button" class="ib" data-b="solid" aria-label="Leere Tafel oder über das Spiel malen">⬜</button>
    </div>
    <span class="sep"></span>

/* ---------- game 1: trace it ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const TRACE_STARS = [[0.3,0.55,0.75],[0.4,0.65,0.86],[0.4,0.65,0.84]];

function letterGeom(ch, w, h){

    if (ex === mw - 1 || !Lm[i + 1]) edge++;

}

/* ---------- game 3: memory match ---------- */
function gridFit(n, w, h, ratio, gap){
  let best = { size:0, cols:1 };
  for (let c = 1; c <= n; c++) {
    if (n % c) continue;
    const r = n / c, cw = (w - gap * (c - 1)) / c, ch = (h - gap * (r - 1)) / r;
    const s = Math.min(cw, ch * ratio);

  }

}
function matchSize(lane){
  const m = lane.m, w = lane.body.clientWidth - 24, h = lane.body.clientHeight - 30;

  m.grid.style.gridTemplateColumns = 'repeat(' + f.cols + ',' + cs + 'px)';
}
function flipCard(lane, c){

  c.open = true; c.e.classList.add('open'); sfx.flip(); m.open.push(c);
  if (m.open.length < 2) return;
  const a = m.open[0], b = m.open[1];
  if (a.L === b.L) {
    m.open = []; a.got = b.got = true; m.got++;
    a.e.classList.add('got'); b.e.classList.add('got');
    addScore(lane, 10); floatAt(lane, b.e, '+10'); sfx.good();
    if (m.got === m.n) {
      lane.done = true;
      let pts = 10, msg = 'Alle Paare gefunden!';

    }
  } else {
    m.busy = true;
    after(900, () => { a.open = b.open = false; a.e.classList.remove('open'); b.e.classList.remove('open'); m.open = []; m.busy = false; });
  }
}

  e.addEventListener('pointerdown', ev => {
    if (d || lane.done || clock.paused || G.roundOver || e.classList.contains('placed')) return;

const PENS = ['ink','#E8344E','#2F6BFF','#17A566','#F59A0B','#9B4DFF'];
const SIZES = [5, 11, 22];
const B = { strokes:[], active:new Map(), pen:0, size:1, erase:false, solid:false, guide:false, gi:0, cv:$('#bd-cv'), ctx:null, w:0, h:0, dpr:1, ox:0, oy:0, k:1 };
B.ctx = B.cv.getContext('2d');
const penColor = c => c === 'ink' ? cssVar('--ink') : c;
function boardUI(){
  $('#bd-pens').innerHTML = PENS.map((c, i) => '<button type="button" class="pen ' + (!B.erase && B.pen === i ? 'on' : '') + '" data-pen="' + i + '" style="--pcol:' + (c === 'ink' ? 'var(--ink)' : c) + '" aria-label="Stiftfarbe ' + (i + 1) + '"></button>').join('');
  $('#bd-sizes').innerHTML = SIZES.map((s, i) => '<button type="button" class="sz ' + (B.size === i ? 'on' : '') + '" data-size="' + i + '" style="--d:' + (0.3 + i * 0.35) + 'em" aria-label="Stiftgröße ' + (i + 1) + '"></button>').join('');
  $('[data-b="erase"]').classList.toggle('on', B.erase);
  $('[data-b="solid"]').classList.toggle('on', B.solid);
  $('[data-b="guide"]').classList.toggle('on', B.guide);
  $('#board').classList.toggle('solid', B.solid);
  const L = LETTERS[B.gi];
  $('#bd-letter').textContent = L.ch;
  $('#bd-guide').hidden = !B.guide;
  $('#bd-guide .ar').textContent = L.ch; $('#bd-guide b').textContent = L.name;
}
function boardSize(){
  const r = B.cv.getBoundingClientRect();
  B.w = r.width; B.h = r.height; B.ox = r.left; B.oy = r.top; B.dpr = Math.min(2, window.devicePixelRatio || 1);
  B.k = clamp(Math.min(B.w, B.h) / 600, 1, 2.6);
  B.cv.width = Math.round(B.w * B.dpr); B.cv.height = Math.round(B.h * B.dpr);
  boardDraw();
}
function boardStyle(s){
  const c = B.ctx;
  c.globalCompositeOperation = s.er ? 'destination-out' : 'source-over';
  c.strokeStyle = s.er ? '#000' : penColor(s.c); c.lineWidth = s.w; c.lineCap = 'round'; c.lineJoin = 'round';
}
function boardDraw(){
  const c = B.ctx; c.setTransform(B.dpr, 0, 0, B.dpr, 0, 0); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, B.w, B.h);
  B.strokes.forEach(s => { boardStyle(s); strokePath(c, s.pts, 1); });
}
function openBoard(){ $('#board').hidden = false; clock.paused = true; boardUI(); boardSize(); }
function closeBoard(){ $('#board').hidden = true; B.active.clear(); clock.paused = false; }
B.cv.addEventListener('pointerdown', e => {
  e.preventDefault(); try { B.cv.setPointerCapture(e.pointerId); } catch (err) {}
  const s = { c:PENS[B.pen], w:SIZES[B.size] * B.k * (B.erase ? 3 : 1), er:B.erase, pts:[{ x:e.clientX - B.ox, y:e.clientY - B.oy }] };
  B.strokes.push(s); B.active.set(e.pointerId, s); boardStyle(s); strokePath(B.ctx, s.pts, 1);
});
B.cv.addEventListener('pointermove', e => {
  const s = B.active.get(e.pointerId); if (!s) return;
  boardStyle(s);
  coalesced(e).forEach(ev => { const p = { x:ev.clientX - B.ox, y:ev.clientY - B.oy }, a = s.pts[s.pts.length - 1]; B.ctx.beginPath(); B.ctx.moveTo(a.x, a.y); B.ctx.lineTo(p.x, p.y); B.ctx.stroke(); s.pts.push(p); });
});
const boardUp = e => { B.active.delete(e.pointerId); };
B.cv.addEventListener('pointerup', boardUp); B.cv.addEventListener('pointercancel', boardUp);
$('#bd-tools').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-pen')) { B.pen = +t.getAttribute('data-pen'); B.erase = false; }
  else if (t.hasAttribute('data-size')) { B.size = +t.getAttribute('data-size'); }
  else {
    const a = t.getAttribute('data-b'), n = LETTERS.length;
    if (a === 'close') { closeBoard(); return; }
    if (a === 'erase') B.erase = !B.erase;
    else if (a === 'undo') { B.strokes.pop(); boardDraw(); }
    else if (a === 'clear') { B.strokes.length = 0; boardDraw(); }
    else if (a === 'solid') { B.solid = !B.solid; if (!B.solid) B.guide = false; }
    else if (a === 'guide') { B.guide = !B.guide; if (B.guide) B.solid = true; }
    else if (a === 'prev' || a === 'next') { B.gi = (B.gi + (a === 'next' ? 1 : n - 1)) % n; B.guide = true; B.solid = true; }
  }
  boardUI();
});
$$('.board-btn').forEach(b => b.addEventListener('click', openBoard));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#board').hidden) closeBoard(); });

    duas:{title:'Duas', tabs:DUAS.map((d, i) => [String(i), (i + 1) + '. ' + d.short])}
  };
  const root = $('#neu'), V = $('#n-view'), tabsEl = $('#n-tabs');
  function render(){
    const m = MODES[N.mode], cur = N.mode === 'duas' ? String(N.dua) : N.tab;
    $('#n-title').textContent = m.title;
    tabsEl.innerHTML = m.tabs.map(t => '<button type="button" class="' + (t[0] === cur ? 'on' : '') + '" data-act="tab" data-v="' + t[0] + '" aria-pressed="' + (t[0] === cur) + '">' + t[1] + '</button>').join('');
    V.innerHTML = '<div class="dy">' + (N.mode === 'duas' ? vDua() : N.tab === 'paare' ? vPaare() : N.tab === 'karten' ? vKarten() : vBuchstaben()) + '</div>';
  }
  function open(mode){ N.mode = MODES[mode] ? mode : 'lernen'; show('neu'); render(); V.scrollTop = 0; }
  $('#n-home').addEventListener('click', () => { try { window.speechSynthesis.cancel(); } catch (e) {} show('home'); });
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    if (act === 'tab') { if (N.mode === 'duas') { N.dua = +v; N.dstep = 1; } else N.tab = v; }
    else if (act === 'go') { N.idx = +v; }
    else if (act === 'step') { N.idx = clamp(N.idx + (+v), 0, DL.length - 1); }
    else if (act === 'hide') { N.hide = !N.hide; }
    else if (act === 'open') { N.cardOpen = true; }
    else if (act === 'card') { if (N.cardAt >= N.cards.length - 1) dealCards(); else { N.cardAt++; N.cardOpen = false; } }
    else if (act === 'dstep') { N.dstep = +v; }
    else if (act === 'dnav') { N.dstep = clamp(N.dstep + (+v), 1, DUAS[N.dua].parts.length); }
    else if (act === 'speak') { speak(v); return; }
    else if (act === 'write') { B.gi = Math.max(0, LETTERS.findIndex(x => x.ch === v)); B.guide = true; B.solid = true; openBoard(); return; }
    else return;
    render();
    if (act === 'tab') V.scrollTop = 0;
  });
  document.addEventListener('keydown', e => {
    if (root.hidden || !$('#board').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    /* Arabic runs right to left: the left arrow goes forward */
    const d = e.key === 'ArrowLeft' ? 1 : -1;
    if (N.mode === 'duas') N.dstep = clamp(N.dstep + d, 1, DUAS[N.dua].parts.length);
    else if (N.tab === 'buchstaben') N.idx = clamp(N.idx + d, 0, DL.length - 1);
    else return;
    render();
  });

  /* quiz games: four lanes, everyone answers at the same time */
  const VOC = {'ضفدع':'ضِفْدَع','أخضر':'أَخْضَر','أبيض':'أَبْيَض','طفل':'طِفْل','مطر':'مَطَر','قط':'قِطّ','ظرف':'ظَرْف','نظيف':'نَظِيف','حظ':'حَظّ','عين':'عَيْن','لعبة':'لُعْبَة','ربيع':'رَبِيع','غيمة':'غَيْمَة','صغير':'صَغِير','صمغ':'صَمْغ','فيل':'فِيل','تفاح':'تُفَّاح','صيف':'صَيْف','قمر':'قَمَر','بقرة':'بَقَرَة','طريق':'طَرِيق','كتاب':'كِتَاب','سكر':'سُكَّر','سمك':'سَمَك','ليمون':'لَيْمُون','حليب':'حَلِيب','جبل':'جَبَل','موز':'مَوْز','شمس':'شَمْس','قلم':'قَلَم','نمر':'نَمِر','عنب':'عِنَب','جبن':'جُبْن','هلال':'هِلَال','نهر':'نَهْر','وجه':'وَجْه','ولد':'وَلَد','نور':'نُور','دلو':'دَلْو','يد':'يَد','بيت':'بَيْت','كرسي':'كُرْسِيّ'};
  const RW = WORDS.map(w => ({v:VOC[w[0]] || w[0], de:w[1], tr:w[2]}));   /* words for the reading game */
  const QZ_TIME = {find:15000, name:15000, form:15000, word:18000, read:20000};
  const QZ_PROMPT = {find:'Lies den Namen. Tipp auf den Buchstaben.', name:'Wie heißt dieser Buchstabe?', form:'Welcher Buchstabe ist das?', word:'Welcher Buchstabe steckt im Wort?', read:'Lies das Wort. Wie klingt es?'};
  function quizOpts(l, lvl, word, own){
    /* four answers; higher levels get more look-alikes */
    const bad = c => c === l.ch || (word && norm(word[0]).indexOf(c) >= 0);
    const near = shuffle(l.look.filter(c => !bad(c) && (!own || BY[c]))).slice(0, lvl === 0 ? 0 : lvl === 1 ? 1 : 3);
    const rest = shuffle(DL.map(x => x.ch).filter(c => !bad(c) && l.look.indexOf(c) < 0));
    return shuffle([l.ch].concat(near, rest.slice(0, 3 - near.length)));
  }
  function quizSize(lane){
    const w = lane.body.clientWidth, h = lane.body.clientHeight;
    lane.body.style.setProperty('--qu', clamp(Math.min(w, h * 0.62), 110, 520) + 'px');
  }
  function quizStim(){
    const L = G.L, k = G.id, q = G.q;
    if (k === 'read') return A(L.v, 'qz-word');
    if (k === 'find') return '<b class="qz-name">' + esc(L.name) + '</b><span class="qz-cap">' + esc(L.sound) + '</span>';
    if (k === 'name') return A(L.ch, 'qz-big');
    if (k === 'form') return A(q.glyph, 'qz-big') + '<span class="qz-cap">' + POS[q.pos] + '</span>';
    return A(q.word[0], 'qz-word') + '<span class="qz-cap"><b>' + esc(q.word[1]) + '</b> ' + esc(q.word[2]) + '</span>';
  }
  function quizResult(lane, state, label){
    const L = G.L, q = G.q, k = G.id;
    const main = k === 'dua' ? q.res : k === 'read' ? A(L.v, 'qz-word') + '<b class="qz-rn">' + esc(L.tr) + '</b><span class="qz-cap"><b>' + esc(L.de) + '</b></span>'
      : A(k === 'word' ? hl(q.word[0], L.ch) : L.ch, k === 'word' ? 'qz-word' : 'qz-big') + '<b class="qz-rn">' + esc(L.name) + '</b>';
    lane.qz.stim.className = 'qz-stim ' + state;
    lane.qz.stim.innerHTML = '<span class="qz-ic" aria-hidden="true">' + (state === 'ok' ? '✓' : state === 'no' ? '✗' : '⏰') + '</span>' + main + (label ? '<span class="qz-pts">' + label + '</span>' : '');
    lane.qz.btns.forEach(b => { b.e.disabled = true; if (b.c === G.key) b.e.classList.add('right'); });
  }
  function quizPick(lane, b){
    if (lane.done || clock.paused || G.roundOver) return;
    lane.done = true;
    if (b.c === G.key) {
      let pts = 10, label = '+10';
      if (firstBonus()) { pts = 15; label = 'Zuerst! +15'; }
      addScore(lane, pts); sfx.good(); quizResult(lane, 'ok', label);
    } else { b.e.classList.add('wrong'); sfx.bad(); quizResult(lane, 'no', 'Noch nicht'); }
    if (G.lanes.every(l => l.done)) endRound(2200);
  }
  function quizRound(){
    const L = G.L = draw(), k = G.id, q = G.q = {}, txt = k === 'name' || k === 'read';
    G.key = k === 'read' ? L.tr : L.ch;
    if (k === 'word') q.word = pick(WORDS.filter(w => w[0].indexOf(L.ch) >= 0));
    if (k === 'form') { q.pos = L.ch === 'و' ? 'rechts' : pick(['anfang','mitte','ende']); q.glyph = forms(L.ch)[q.pos === 'rechts' ? 'ende' : q.pos]; }
    if (k === 'find') say(L);
    setPrompt(QZ_PROMPT[k]);
    G.time = G.timeMax = QZ_TIME[k];
    G.lanes.forEach(lane => {
      lane.body.innerHTML = '<div class="qz"><div class="qz-stim"></div><div class="qz-opts"></div></div>';
      const stim = $('.qz-stim', lane.body), box = $('.qz-opts', lane.body);
      stim.innerHTML = quizStim();
      const opts = k === 'read' ? shuffle([L.tr].concat(shuffle(RW.filter(x => x !== L)).slice(0, 3).map(x => x.tr))) : quizOpts(L, lane.p.level, q.word, k === 'name');
      const btns = opts.map(c => {
        const e = el('button', 'qz-opt' + (txt ? ' txt' : ' ar') + (k === 'read' ? ' rd' : ''), k === 'name' ? esc(BY[c].name) : esc(c));
        e.type = 'button'; if (!txt) e.setAttribute('lang', 'ar');
        const b = {e:e, c:c}; tap(e, () => quizPick(lane, b)); box.appendChild(e); return b;
      });
      lane.qz = {stim:stim, btns:btns};
      quizSize(lane);
    });
  }
  const quizGame = (title, speaks, pool, rounds) => ({
    title:title, speaks:speaks, count:4, pool:pool || DL, rounds:rounds || {short:7, normal:14, long:21},
    round:quizRound,
    timeUp(){ G.lanes.forEach(l => { if (!l.done) { l.done = true; quizResult(l, 'late', ''); } }); endRound(2200); },
    resize(){ G.lanes.forEach(l => { if (l.qz) quizSize(l); }); }
  });
  GAMES.find = quizGame('Finde den Buchstaben', true);
  GAMES.name = quizGame('Wie heißt er?', false);
  GAMES.form = quizGame('Formen-Jagd', false);
  GAMES.word = quizGame('Wort-Jagd', false);
  GAMES.read = quizGame('Wörter lesen', false, RW, {short:8, normal:12, long:20});

  /* dua game: both duas, part by part. First look and say it together, then build it, then the meaning. */
  const DU_MEAN = ['Alles Lob gehört Allah. Er hat uns aufgeweckt.', 'O Allah, beschütze mich vor allem Bösen.'];
  const DU_WRONG = ['O Allah, segne unser Essen.', 'O Allah, schenk mir einen guten Schlaf.'];
  const DU_WHEN = ['Beim Aufwachen', 'Vor der Toilette', 'Vor dem Essen', 'Vor dem Schlafen'];
  const DU_SCRIPT = [];
  DUAS.forEach((d, i) => { DU_SCRIPT.push({t:'show', d:i}); d.parts.forEach((p, k) => DU_SCRIPT.push({t:'next', d:i, k:k})); DU_SCRIPT.push({t:'mean', d:i}); });
  DUAS.forEach((d, i) => DU_SCRIPT.push({t:'when', d:i}));
  const duPart = p => A(p[0], 'du-ar') + '<span class="du-tr">' + esc(p[1]) + '</span>';
  const duText = (d, k) => d.parts.slice(0, k).map(p => p[0]).join(' ');
  const duChain = (d, k) => A(duText(d, k), 'du-chain') + '<span class="du-tr">' + esc(d.parts.slice(0, k).map(p => p[1]).join(' ')) + '</span>';
  function duaRound(){
    const s = DU_SCRIPT[G.round - 1], d = DUAS[s.d], other = DUAS[1 - s.d], n = d.parts.length;
    const head = '<span class="du-when">Dua ' + (s.d + 1) + ' · ' + esc(d.title) + '</span>';
    let prompt, stim, res = '', opts = null, time = 15000;
    G.key = null; G.L = {ar:duText(d, n)};
    if (s.t === 'show') {
      prompt = 'Schaut und sprecht zusammen.'; stim = head + duChain(d, n); time = 14000;
    } else if (s.t === 'next') {
      prompt = s.k === 0 ? 'Wie fängt die Dua an?' : 'Wie geht die Dua weiter?';
      stim = head + (s.k ? duChain(d, s.k) : '') + '<span class="du-q">?</span>';
      /* wrong answers: the later parts of this dua first, then parts of the other dua */
      const wrong = d.parts.slice(s.k + 1).concat(shuffle(other.parts)).slice(0, 3);
      opts = [d.parts[s.k]].concat(wrong).map(p => ({c:p[1], html:duPart(p)}));
      G.key = d.parts[s.k][1]; G.L = {ar:duText(d, s.k)};
      res = head + duChain(d, s.k + 1);
    } else if (s.t === 'mean') {
      prompt = 'Was bedeutet diese Dua?'; stim = head + duChain(d, n);
      opts = DU_MEAN.concat(DU_WRONG).map(m => ({c:m, html:'<span class="du-de">' + esc(m) + '</span>'}));
      G.key = DU_MEAN[s.d]; res = head + '<b class="du-de big">' + esc(DU_MEAN[s.d]) + '</b>';
    } else {
      prompt = 'Wann sagen wir diese Dua?'; stim = duChain(d, n);
      opts = DU_WHEN.map(m => ({c:m, html:'<span class="du-de">' + esc(m) + '</span>'}));
      G.key = DU_WHEN[s.d]; res = head + duChain(d, n);
    }
    G.q = {res:res, show:!opts};
    setPrompt(prompt);
    G.time = G.timeMax = time;
    if (!opts) say(G.L);
    G.lanes.forEach(lane => {
      lane.body.innerHTML = '<div class="qz du' + (opts ? '' : ' show') + '"><div class="qz-stim"></div><div class="qz-opts du-opts"></div></div>';
      const stimEl = $('.qz-stim', lane.body), box = $('.qz-opts', lane.body);
      stimEl.innerHTML = stim;
      let btns = [];
      if (opts) btns = shuffle(opts).map(o => {
        const e = el('button', 'qz-opt du-opt', o.html); e.type = 'button';
        const b = {e:e, c:o.c}; tap(e, () => quizPick(lane, b)); box.appendChild(e); return b;
      });
      else { box.innerHTML = '<p class="du-mean">' + esc(d.mean) + '</p>'; lane.done = true; }
      lane.qz = {stim:stimEl, btns:btns};
      quizSize(lane);
    });
  }
  GAMES.dua = {
    title:'Dua-Spiel', speaks:true, count:4, pool:DL, rounds:{short:DU_SCRIPT.length, normal:DU_SCRIPT.length, long:DU_SCRIPT.length},
    round:duaRound,
    timeUp(){
      if (G.q.show) { endRound(300); return; }
      G.lanes.forEach(l => { if (!l.done) { l.done = true; quizResult(l, 'late', ''); } }); endRound(2200);
    },
    resize(){ G.lanes.forEach(l => { if (l.qz) quizSize(l); }); }
  };

  return {open:open, letters:DL, where:where, key:() => G && G.key};
})();
$$('[data-neu]').forEach(b => b.addEventListener('click', () => NEU.open(b.getAttribute('data-neu'))));
try { document.documentElement.lang = 'de'; } catch (e) {}

/* ---------- global ---------- */
let rzT = 0;
function relayout(){ if (G && !$('#game').hidden && G.def.resize) G.def.resize(); if (!$('#board').hidden) boardSize(); }
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(relayout, 160); });
try { document.fonts.addEventListener('loadingdone', () => { if (G && G.id === 'trace' && !$('#game').hidden) relayout(); }); } catch (e) {}
document.addEventListener('contextmenu', e => { if (!e.target.closest('input')) e.preventDefault(); });

load(); renderHome(); setMuted(S.muted); fontsReady();
})();
</script>
